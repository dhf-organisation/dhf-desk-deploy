version: 2

# The app itself has no package manager — every library is a <script> tag from
# a CDN, so Dependabot can't see them (see docs/security.md, "Third-party
# scripts"). What it can watch is the GitHub Actions we pin by SHA, which
# otherwise silently go stale.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      # codeql-action/init and codeql-action/analyze must run the SAME
      # version — a mismatch fails the run with "Loaded a configuration file
      # for version X, but running version Y". Ungrouped, Dependabot opens one
      # PR per step, and neither can pass on its own. Learned the hard way on
      # PRs #13 and #15.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
      # Everything else travels together too: these are all first-party
      # GitHub actions, the diff is a handful of SHAs, and one PR a week is
      # easier to actually review than four.
      github-actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'github/codeql-action*'
