name: CodeQL

# Static analysis for the browser JavaScript. Free on public repositories;
# on a private repo this needs GitHub Code Security (see docs/security.md).

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 19 * * 1' # Monday ~05:17 Melbourne

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: github/codeql-action/init@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3.29.0
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v3.29.0
