name: CodeQL

# Static analysis for the browser JavaScript. Free on public repositories;
# on a private repo this needs GitHub Code Security (see docs/security.md).

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 19 * * 1' # Monday ~05:17 Melbourne

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
