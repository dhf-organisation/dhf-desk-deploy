name: Secret scan

# GitHub's own secret scanning + push protection is enabled on this repo and
# catches provider-format secrets as they are pushed. gitleaks adds a second
# pass over the diff (and, on a schedule, the whole history) for things
# GitHub's patterns miss — e.g. a Netlify token pasted into a shell script,
# which is exactly how one was found on a machine in September 2026.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '32 20 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history on the scheduled run, shallow on PRs.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
