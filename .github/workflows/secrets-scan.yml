name: Secret scan

# GitHub's own secret scanning + push protection is enabled on this repo and
# catches provider-format secrets as they are pushed. gitleaks adds a second
# pass over the diff (and, on a schedule, the whole history) for things
# GitHub's patterns miss — e.g. a Netlify token pasted into a shell script,
# which is exactly how one was found on a machine in September 2026.
#
# We run the gitleaks binary directly rather than gitleaks-action, because
# that action requires a paid licence key on organisation repositories. The
# tool itself is MIT-licensed and free; the release is pinned by version and
# verified by checksum.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '32 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed long ago is still a live secret,
          # and this repo is small enough that scanning all of it is cheap.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan repository history
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .

      - name: Scan working tree
        # Catches an uncommitted or generated file a history scan wouldn't see.
        run: gitleaks dir --no-banner --redact --verbose --exit-code 1 .
