<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHF Desk</title>

<!-- ── No-flash theme init (v5) ──────────────────────────────────────────
     MUST stay here: before the stylesheet and before app.js, so data-theme is
     on <html> before the first paint. Reads the saved choice, else the OS
     preference. Deliberately inline and blocking; try/catch because
     localStorage throws in a blocked-cookies/private context.
     NIGHT GARAGE: the fallback when nothing is saved and the OS gives no
     signal is now 'dark' — this system is dark-first. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('dhf-theme');
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

<!-- Night garage typography: Instrument Serif carries display (roman only —
     italic is never loaded, so it can't sneak in), Geist carries UI and body,
     JetBrains Mono carries UPPERCASE machine labels. APP UI ONLY: the three
     print/email builders in app.js (buildInvoiceHtml, buildJobCardHtml,
     printPaymentsReport) emit safe-font literals and never see these faces. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- The token spine. Every colour, font, radius, shadow and duration below
     resolves through this file — nothing in the page style block invents a
     value. See design.md for the locked system. -->
<link rel="stylesheet" href="tokens.css">

<style>
/* Hallmark · genre: atmospheric · macrostructure: Workbench · design-system: design.md · designed-as-app
 * nav: N3 side-rail · footer: none (app) · contrast: pass (40–41) · mobile: pass (34, 49–57) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}

body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ── Base atmosphere ──────────────────────────────────────────────────
   Two blooms, nothing more: brass from the top-left corner, a faint coral
   chord low right. Fixed, so it reads as the room rather than something that
   scrolls with the content. pointer-events:none so it can never intercept a
   drag (the diary and hoist board are drag surfaces). */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--aurora);background-attachment:fixed}

h1,h2,h3,.h-display,.h1,.h2,.h3{font-family:var(--font-display);font-weight:400;letter-spacing:-.01em;font-style:normal}

/* Machine readouts and figures: the mono face is a register, not a body. */
.mono,.data{font-family:var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:0}

/* Focus — instant, 2px brass, never animated in. */
:focus-visible{outline:var(--border-width-strong) solid var(--focus-solid);outline-offset:2px;border-radius:var(--radius-sm)}

::selection{background:var(--accent);color:var(--accent-text)}
input[type=checkbox],input[type=radio],progress{accent-color:var(--accent)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border:3px solid transparent;background-clip:content-box;border-radius:var(--radius-pill)}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover);background-clip:content-box}
*{scrollbar-color:var(--scrollbar-thumb) transparent}

/* ── Surface primitives ───────────────────────────────────────────────
   Night garage has no glass and no blur: panels are solid, elevated by a
   lightness step, and lit from within by a faint brass emission at the top
   edge. .glass kept as the hero-panel variant (emit + softer shadow);
   .glass-solid is the dense-screen workhorse (flat, cheap, hundreds on
   screen at once). Names kept so app.js-rendered markup styles unchanged. */
.glass{background:var(--surface);background-image:var(--card-emit);
  border:var(--border-width) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card)}
.glass-solid{background:var(--surface);border:var(--border-width) solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-card)}
/* The signature gradient, with dark ink text that clears AA at every stop. */
.grad-surface{background-image:var(--grad-scrim),var(--grad-primary);color:var(--text-on-grad);
  border-radius:var(--radius);box-shadow:var(--shadow-soft)}
.grad-surface .field-label,.grad-surface .panel-title,.grad-surface h1,.grad-surface h2,.grad-surface h3{color:var(--text-on-grad)}
/* Hierarchy on the gradient is carried by weight, never by dimming — ink at
   full strength stays 5.2:1 at the worst stop. */
.grad-surface .muted,.grad-surface .field-label{color:var(--text-on-grad);font-weight:500}

/* One hover signal: a small lift. Nothing else moves. */
.lift{transition:transform var(--duration-fast) var(--ease-out)}
.lift:hover{transform:translateY(-2px)}

/* ── Load motion ──────────────────────────────────────────────────────
   A soft fade-up-and-settle. One orchestrated entrance, then the page is
   still. */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise var(--duration) var(--ease-out) both}
.stagger>*{animation:rise var(--duration) var(--ease-out) both}
.stagger>*:nth-child(1){animation-delay:0ms}
.stagger>*:nth-child(2){animation-delay:60ms}
.stagger>*:nth-child(3){animation-delay:120ms}
.stagger>*:nth-child(4){animation-delay:180ms}
.stagger>*:nth-child(5){animation-delay:240ms}
.stagger>*:nth-child(6){animation-delay:300ms}
.stagger>*:nth-child(n+7){animation-delay:360ms}

/* ── Accessibility floor: motion is enhancement, never required ────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-delay:0ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
  .lift:hover,.panel:hover,.btn-primary:hover,.quick-add-btn:hover,
  .diary-card:hover,.hoist-unassigned-card:hover,
  .btn-secondary:hover,.template-option-card:hover{transform:none !important}
  .chamber-filament{animation:none !important;opacity:1 !important}
}

/* ════════════════════════════════════════════════════════════════════
   LOGIN — the showpiece. The only page with an apparatus: a filament
   chamber burning on the blueprint bench, a serif headline with one
   coral verb, and a meter strip signing the page off.
   ════════════════════════════════════════════════════════════════════ */
.login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:var(--space-8) var(--space-6) 0;gap:var(--space-8);
  background:
    linear-gradient(var(--blueprint) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(90deg, var(--blueprint) 1px, transparent 1px) 0 0 / 48px 48px,
    radial-gradient(60% 50% at 72% 24%, var(--paper-emit) 0%, transparent 65%);}
.login-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:var(--space-16);align-items:center;width:100%;max-width:920px;margin-top:auto}
.login-card{animation:rise var(--duration) var(--ease-out) both}
.login-eyebrow{font-family:var(--font-data);font-size:var(--text-micro);font-weight:500;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--space-4)}
.login-title{font-family:var(--font-display);font-style:normal;font-size:var(--text-display);line-height:1.04;letter-spacing:-.015em;color:var(--text);margin-bottom:var(--space-4);max-width:14ch;overflow-wrap:anywhere}
/* The verb landmark: one coral word, upright, underlined once on load. */
.login-title em{font-style:normal;color:var(--accent-2);position:relative;white-space:nowrap}
.login-title em::after{content:'';position:absolute;left:.05em;right:.05em;bottom:.04em;height:1px;background:var(--accent-2);transform-origin:left;animation:pivot-underline 320ms var(--ease-out) 900ms backwards}
@keyframes pivot-underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.login-sub{font-size:var(--text-base);color:var(--text-muted);margin-bottom:var(--space-8)}
.login-domain{font-size:var(--text-sm);color:var(--text-muted);margin-top:var(--space-4);padding:var(--space-3);
  background:var(--inset-bg);border:var(--border-width) solid var(--border);border-radius:var(--radius-sm)}

/* The apparatus — a filament chamber. Built, not placed: pure CSS, one per
   page, pulsing gently like the inspection lamp that never gets switched
   off. Callouts carry real facts about the desk, never dummy data. */
.apparatus{position:relative;display:flex;justify-content:center;animation:rise var(--dur-long) var(--ease-out) 150ms both}
.chamber{position:relative;width:clamp(150px,18vw,210px);aspect-ratio:0.55;
  border:var(--border-width) solid var(--border);border-radius:var(--radius-pill);
  background:var(--surface);overflow:hidden;box-shadow:var(--shadow-soft)}
.chamber-electrode{position:absolute;left:0;right:0;top:var(--y);height:1px;background:var(--border)}
.chamber-filament{position:absolute;top:8%;bottom:8%;left:50%;width:2px;margin-left:-1px;
  background:linear-gradient(to bottom,var(--filament-tip) 0%,var(--accent) 50%,var(--filament-tip) 100%);
  box-shadow:0 0 16px 4px var(--accent-glow),0 0 48px 12px var(--filament-halo);
  animation:filament-pulse var(--dur-pulse) var(--ease-in-out) infinite}
.chamber-glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 50%,var(--chamber-wash) 0%,transparent 70%)}
.chamber-stencil{position:absolute;bottom:var(--space-3);left:0;right:0;text-align:center;
  font-family:var(--font-data);font-size:10px;letter-spacing:var(--tracking-label);color:var(--text-tertiary)}
@keyframes filament-pulse{0%,100%{opacity:1}50%{opacity:.86}}
.callouts{list-style:none}
.callout{position:absolute;top:var(--y);font-family:var(--font-data);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);white-space:nowrap}
.callout::before{content:'';position:absolute;top:50%;width:var(--space-6);height:1px;background:var(--border)}
.callout[style*="left"]{right:calc(50% + 96px)}
.callout[style*="left"]::before{left:100%;margin-left:var(--space-1)}
.callout[style*="right"]{left:calc(50% + 96px)}
.callout[style*="right"]::before{right:100%;margin-right:var(--space-1)}

/* The meter strip — a printed readout signing the page off. Bars follow a
   hand-set envelope, never a flat row of equal ticks. Static on purpose. */
.meter{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-6);align-items:center;
  width:100%;max-width:920px;padding:var(--space-3) 0 var(--space-4);margin-top:auto;
  border-top:var(--border-width) solid var(--hairline)}
.meter-label{font-family:var(--font-data);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary);white-space:nowrap}
.meter-bars{display:flex;gap:2px;align-items:flex-end;height:28px}
.meter-bars>span{flex:1;min-width:1px;background:var(--accent);opacity:.55;border-radius:.5px}

@media(max-width:900px){
  .login-grid{grid-template-columns:minmax(0,1fr);gap:var(--space-8);max-width:440px}
  .login-title{font-size:var(--text-2xl)}
  .apparatus{order:2}
  .chamber{width:150px}
  .callout{display:none}   /* leader lines need the wide stage; the chamber stands alone */
  .meter{gap:var(--space-3)}
}

/* ════════════════════════════════════════════════════════════════════
   APP SHELL — side rail + work column.
   The 13-view top bar became a grouped rail: mono group labels, one brass
   active marker. app.js only knows `#app-nav button[data-view]` and the
   .active class — both preserved exactly; the grouping divs are inert.
   ════════════════════════════════════════════════════════════════════ */
.app{display:none}
.app-shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
  border-right:var(--border-width) solid var(--hairline);background:var(--header-bg);
  padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:var(--space-4)}
/* The wordmark: serif, "desk" in brass — the brand's one two-colour moment. */
.app-logo{font-family:var(--font-display);font-style:normal;font-size:var(--text-xl);letter-spacing:-.01em;color:var(--text);
  padding:var(--space-2) var(--space-2) 0;white-space:nowrap}
.app-logo-accent{color:var(--accent)}
.app-nav{display:flex;flex-direction:column;gap:2px}
.rail-group-label{font-family:var(--font-data);font-size:10px;font-weight:500;letter-spacing:var(--tracking-label);text-transform:uppercase;
  color:var(--text-tertiary);padding:var(--space-4) var(--space-2) var(--space-1)}
.app-nav button{font-family:inherit;text-align:left;background:none;border:none;padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:500;color:var(--text-muted);cursor:pointer;white-space:nowrap;
  border-left:var(--border-width-strong) solid transparent;
  transition:background-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
/* The rail's active marker: a brass edge + tint — the current view is the
   one lit thing in the rail. */
.app-nav button.active{background:var(--accent-tint);color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
.app-nav button:hover:not(.active){background:var(--control-bg);color:var(--text)}

.app-col{min-width:0;display:flex;flex-direction:column}
/* Slim top bar: search, create, theme, user. Opaque — no glass, no blur. */
.app-header{position:sticky;top:0;z-index:300;background:var(--header-bg);
  border-bottom:var(--border-width) solid var(--hairline);
  color:var(--text);padding:var(--space-3) var(--space-4);display:flex;justify-content:flex-end;align-items:center;gap:var(--space-4)}
.app-right{display:flex;align-items:center;gap:var(--space-2)}
.app-quick{display:flex;align-items:center;gap:var(--space-2)}
.quick-search-wrap{position:relative}
/* Fixed-size trigger only. The real input and results live in a
   fixed-position overlay injected by openQuickSearchPanel(), so nothing
   here can stretch or push the bar. */
.quick-search-trigger{height:32px;padding:0 var(--space-3) 0 var(--space-2);display:flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-sm);border:var(--border-width) solid var(--border-strong);background:var(--control-bg);color:var(--text-muted);font-family:inherit;font-size:var(--text-sm);font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out)}
.quick-search-trigger:hover{background:var(--accent-tint);border-color:var(--accent-ink);color:var(--accent-ink)}
.quick-search-kbd{font-family:var(--font-data);font-size:10px;font-weight:500;letter-spacing:.04em;padding:2px 5px;border-radius:var(--radius-sm);background:var(--kbd-bg);color:var(--text-muted)}
@media(max-width:640px){.quick-search-trigger-label,.quick-search-kbd{display:none}.quick-search-trigger{padding:0;width:32px;justify-content:center}}

/* ── Global search palette ─────────────────────────────────────────────
   position:fixed — not a descendant of the header's layout at all, so it
   cannot push, stretch, or resize the bar no matter the query. */
.search-palette-backdrop{position:fixed;inset:0;z-index:600;background:var(--modal-overlay);display:flex;justify-content:center;padding:96px var(--space-4) var(--space-6);animation:fade var(--duration-fast) var(--ease-out) both}
.search-palette{width:100%;max-width:560px;max-height:min(70vh,520px);display:flex;flex-direction:column;background:var(--surface-2);border:var(--border-width) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-modal);overflow:hidden;animation:searchPaletteIn var(--duration) var(--ease-out) both}
@keyframes searchPaletteIn{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
.search-palette-input-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);border-bottom:var(--border-width) solid var(--border);flex-shrink:0}
.search-palette-input-row .icon{font-size:16px;flex-shrink:0;opacity:.55}
.search-palette-input{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:16px;color:var(--text);outline:none}
.search-palette-input::placeholder{color:var(--text-muted)}
.search-palette-esc{font-family:var(--font-data);font-size:var(--text-micro);font-weight:500;color:var(--text-muted);background:var(--inset-bg);padding:3px 6px;border-radius:var(--radius-sm);flex-shrink:0;cursor:pointer}
.search-palette-results{overflow-y:auto}
@media(max-width:640px){.search-palette-backdrop{padding:56px var(--space-3) var(--space-3)}}
@media(prefers-reduced-motion:reduce){.search-palette-backdrop,.search-palette{animation:none !important}}

.quick-search-item{padding:var(--space-2) var(--space-3);font-size:var(--text-sm);cursor:pointer;border-bottom:var(--border-width) solid var(--border)}
.quick-search-item:last-child{border-bottom:none}
.quick-search-item:hover{background:var(--accent-tint)}
.quick-search-item-type{font-family:var(--font-data);font-size:10px;text-transform:uppercase;color:var(--text-tertiary);font-weight:500;letter-spacing:var(--tracking-label)}

/* The bar's primary action — a brass spark, not a gradient ball. */
.quick-add-btn{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-text);border:none;font-size:17px;font-weight:600;cursor:pointer;line-height:1;flex-shrink:0;transition:background-color var(--duration-fast) var(--ease-out),transform var(--duration-fast) var(--ease-out)}
.quick-add-btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.quick-add-btn:active{transform:translateY(0)}
.quick-add-menu{position:fixed;background:var(--surface-2);border:var(--border-width) solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-pop);padding:var(--space-2);min-width:200px;z-index:401}
.quick-add-menu button{font-family:inherit;display:block;width:100%;text-align:left;background:none;border:none;padding:var(--space-2) var(--space-3);font-size:var(--text-compact);font-weight:500;border-radius:var(--radius-sm);cursor:pointer;color:var(--text)}
.quick-add-menu button:hover{background:var(--accent-tint);color:var(--accent-ink)}

.theme-toggle-btn{width:32px;height:32px;padding:0;border-radius:var(--radius-sm);background:var(--control-bg);border:var(--border-width) solid var(--border-strong);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-family:inherit;transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out)}
.theme-toggle-btn:hover{background:var(--accent-tint);border-color:var(--accent-ink);color:var(--accent-ink)}
.theme-toggle-btn svg{width:16px;height:16px;display:block}
/* Which glyph shows is derived from data-theme in CSS, not set by JS. Night
   is the default: it shows the sun (the action — go light); day shows the
   moon. Keeps toggleTheme() to one attribute write. */
.theme-toggle-btn .icon-moon{display:none}
[data-theme="light"] .theme-toggle-btn .icon-sun{display:none}
[data-theme="light"] .theme-toggle-btn .icon-moon{display:block}
.app-user{display:flex;align-items:center;gap:var(--space-2)}
.app-user-name{font-size:var(--text-sm);font-weight:500;white-space:nowrap;color:var(--text)}
.app-logout{font-family:inherit;background:var(--control-bg);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:var(--text-xs);font-weight:500;cursor:pointer;color:var(--text-muted);white-space:nowrap;transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out)}
.app-logout:hover{color:var(--danger-text);border-color:var(--danger);background:var(--danger-tint)}

.main{padding:var(--space-8) var(--space-6);max-width:1100px;margin:0 auto;width:100%}
.main.full-width{max-width:none;padding:var(--space-6)}
/* View switching: old view is cleared instantly (no reflow-squish while the
   next page's data loads), a spinner shows only if the load runs long, and
   the new view fades in once. */
.main.view-enter{animation:viewEnter .16s ease}
@keyframes viewEnter{from{opacity:0}to{opacity:1}}
.view-spinner{display:flex;justify-content:center;padding:var(--space-16) 0}
.view-spinner::after{content:"";width:26px;height:26px;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--accent);animation:viewSpin .6s linear infinite}
@keyframes viewSpin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:var(--space-24) var(--space-6);color:var(--text-muted)}
.empty-state-icon{font-size:22px;margin-bottom:var(--space-4);opacity:.5}
.empty-state-title{font-family:var(--font-display);font-style:normal;font-size:26px;letter-spacing:-.01em;color:var(--text);margin-bottom:var(--space-2)}

/* Inverted pill — a light readout over the night canvas. */
.toast{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%) translateY(10px);background:var(--toast-bg);color:var(--toast-text);padding:var(--space-3) var(--space-6);border-radius:var(--radius-pill);font-size:var(--text-compact);font-weight:600;z-index:999;opacity:0;box-shadow:var(--shadow-pop);transition:opacity var(--duration) var(--ease-out),transform var(--duration) var(--ease-out);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── shared list/detail/form UI ── */
.toolbar{display:flex;gap:var(--space-2);align-items:center;margin-bottom:var(--space-4);flex-wrap:wrap}
/* Form controls carry a 16px bottom margin for stacked forms; inside a
   centre-aligned flex toolbar that margin rides the control high. Fixed at
   the shared-component level, not per screen. */
.toolbar .form-select,.toolbar .form-input,.toolbar .form-textarea,.toolbar .status-tabs{margin-bottom:0}

/* Dense editable grid — deliberately quiet: hairline rules, mono column
   headers, no emission. The eye lands on the totals, not the table. The wrap
   scrolls horizontally on its own so the page body never does. */
.invoice-items-wrap{overflow-x:auto;border-radius:var(--radius-sm)}
.invoice-items-table{width:100%;border-collapse:separate;border-spacing:0;margin:var(--space-4) 0}
.invoice-items-table th{text-align:left;font-family:var(--font-data);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-tertiary);padding:var(--space-3) var(--space-2);background:var(--bg-alt);border-bottom:var(--border-width) solid var(--border);white-space:nowrap}
.invoice-items-table th:first-child{border-radius:var(--radius-sm) 0 0 0}
.invoice-items-table th:last-child{border-radius:0 var(--radius-sm) 0 0}
.invoice-items-table td{padding:var(--space-2);font-size:var(--text-compact);border-bottom:var(--border-width) solid var(--border);vertical-align:middle}
.invoice-items-table input,.invoice-items-table select{width:100%;padding:var(--space-2);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);font-size:var(--text-sm);font-family:inherit;background:var(--input-bg);color:var(--text);transition:border-color var(--duration-fast) var(--ease-out)}
.invoice-items-table input:focus,.invoice-items-table select:focus{outline:none;border-color:var(--focus-solid);box-shadow:0 0 0 3px var(--focus-ring)}
.invoice-items-table .qty-col,.invoice-items-table .price-col{width:90px}
.invoice-items-table .total-col{width:100px;text-align:right;font-weight:700}
.invoice-items-table .tax-col{width:140px}
.invoice-items-table tr.clickable-row{cursor:pointer}
.invoice-items-table tr.clickable-row:hover{background:var(--accent-tint)}
.invoice-items-table .drag-col{width:28px;padding:var(--space-2) 0 var(--space-2) var(--space-1);text-align:center;vertical-align:middle}
.drag-handle{display:inline-block;cursor:grab;color:var(--text-muted);font-size:var(--text-sm);letter-spacing:-1px;line-height:1;user-select:none;padding:var(--space-1) 0}
.drag-handle:active{cursor:grabbing}
.invoice-items-table tr.dragging{opacity:.4}
.invoice-items-table tr.drag-over{background:var(--accent-tint);box-shadow:inset 0 2px 0 var(--accent)}
.invoice-header-row td{border-bottom:var(--border-width) solid var(--border-strong) !important}
.invoice-header-cell{padding:var(--space-4) 0 var(--space-2) !important;display:flex;align-items:center;gap:var(--space-3)}
.invoice-header-input{font-family:inherit;flex:1;min-width:0;padding:var(--space-2) var(--space-3);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);font-size:var(--text-compact);font-weight:700;color:var(--text);background:var(--control-bg)}
.invoice-header-input:focus{outline:none;border-color:var(--focus-solid);box-shadow:0 0 0 3px var(--focus-ring)}
.header-subtotal{font-size:var(--text-base);font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
/* SIGNATURE (Payments): the method-share bars — raw --grad-primary, no
   scrim, because no text sits on these. */
.payment-method-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0}
.payment-method-label{width:150px;font-size:var(--text-compact);font-weight:600;flex-shrink:0}
.payment-method-bar-wrap{flex:1;background:var(--bg-alt);border:none;border-radius:var(--radius-pill);height:10px;overflow:hidden}
.payment-method-bar{display:block;height:100%;background-image:var(--grad-primary);border-radius:var(--radius-pill)}
.payment-method-amount{width:100px;text-align:right;font-size:var(--text-compact);font-weight:700;flex-shrink:0}
.payment-method-pct{width:44px;text-align:right;font-size:var(--text-sm);color:var(--text-muted);flex-shrink:0}
.invoice-items-table .del-col{width:32px;text-align:center}
/* SIGNATURE (invoice / quote detail): the totals card wears the gradient.
   Balance Due is the number the whole screen exists to show.
   Every descendant colour is re-stated because the shared .field-row rules
   assume a themed surface. The --border shadow re-points POS's inline
   `border:1px solid var(--border)` at a rule that reads on brass. */
.invoice-totals{margin-left:auto;max-width:320px;background-image:var(--grad-scrim),var(--grad-primary);color:var(--text-on-grad);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:var(--space-4) var(--space-6);--border:var(--on-grad-rule)}
.invoice-totals .field-row{border-bottom-color:var(--on-grad-rule)}
.invoice-totals input{background:var(--on-grad-input-bg);color:var(--on-grad-input-text)}
.invoice-totals .field-label{color:var(--text-on-grad);font-weight:500}
.invoice-totals .field-val{color:var(--text-on-grad);font-weight:700}
.invoice-totals .field-row.grand{border-top-color:var(--on-grad-rule-strong)}
.invoice-totals .field-row.grand .field-label{color:var(--text-on-grad);font-weight:700}
/* The preview is a miniature of a PRINT document, so it deliberately stays
   flat paper while everything around it is themed: the card is themed, the
   "paper" inside is not. */
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4);margin-top:var(--space-4)}
.template-option-card{border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);padding:var(--space-4);cursor:pointer;background:var(--surface);transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out)}
.template-option-card:hover{border-color:var(--accent)}
.template-option-card.selected{border-color:var(--accent-ink);background:var(--accent-tint);box-shadow:0 0 0 2px var(--accent)}
.template-preview{height:100px;border-radius:6px;margin-bottom:var(--space-2);display:flex;flex-direction:column;overflow:hidden;border:var(--border-width) solid var(--paper-sim-rule);background:var(--paper-sim)}
.template-preview .band{height:24px}
.template-preview .lines{flex:1;padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1)}
.template-preview .lines div{height:5px;background:var(--paper-sim-line);border-radius:2px}
.template-preview.compact .lines div{height:4px}

/* ── Messages ─────────────────────────────────────────────────────────
   SIGNATURE: the connected banner wears the gradient; the warn state stays
   a flat tint — a problem reads as a problem, not as shine. */
.message-row{display:flex;align-items:flex-start;gap:var(--space-3)}
.message-channel-icon{font-family:var(--font-data);font-size:10px;font-weight:500;letter-spacing:var(--tracking-label);text-transform:uppercase;flex-shrink:0;margin-top:1px;width:auto;min-width:46px;text-align:center;padding:3px var(--space-2);border-radius:var(--radius-pill);background:var(--accent-tint);color:var(--accent-ink)}
.message-row-main{flex:1;min-width:0}
.message-row-to{font-weight:600;font-size:var(--text-compact)}
.message-row-subject{font-size:var(--text-compact);font-weight:500;margin-top:var(--space-1)}
.message-row-preview{font-size:var(--text-sm);color:var(--text-muted);margin-top:var(--space-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-row-links{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-1);display:flex;gap:var(--space-2);flex-wrap:wrap}
.message-row-time{font-size:var(--text-xs);color:var(--text-muted);white-space:nowrap;text-align:right;flex-shrink:0}
.message-config-banner{border-radius:var(--radius);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-4);border:var(--border-width) solid transparent}
.message-config-banner.ok{background-image:var(--grad-scrim),var(--grad-primary);color:var(--text-on-grad);box-shadow:var(--shadow-soft)}
.message-config-banner.warn{background:var(--warning-tint);color:var(--warning-text);border-color:color-mix(in srgb,var(--warning) 30%,var(--surface))}

/* ── Chats (demo/mockup screen) — unified customer inbox ── */
.rail-badge-demo{font-family:var(--font-data);font-size:9px;font-weight:700;letter-spacing:var(--tracking-label);text-transform:uppercase;padding:2px 6px;border-radius:var(--radius-pill);background:var(--warning-tint);color:var(--warning-text);margin-left:var(--space-2);vertical-align:1px}
.chat-demo-banner{border-radius:var(--radius);padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-4);background:var(--warning-tint);color:var(--warning-text);border:var(--border-width) solid color-mix(in srgb,var(--warning) 30%,var(--surface))}
.chat-shell{display:flex;height:calc(100vh - 180px);min-height:480px;border:var(--border-width) solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card);background:var(--surface)}
.chat-list-pane{width:320px;flex-shrink:0;border-right:var(--border-width) solid var(--border);display:flex;flex-direction:column;background:var(--bg-alt)}
.chat-list-head{padding:var(--space-4) var(--space-4) var(--space-2)}
.chat-search{margin-top:var(--space-2);margin-bottom:0}
.chat-filter-tabs{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4);margin-bottom:var(--space-2)}
.chat-filter-tab-all{padding:var(--space-2) var(--space-3)}
.chat-filter-tab-icon{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--control-bg);border:var(--border-width) solid var(--border-strong);color:var(--text-muted);cursor:pointer;transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),transform var(--duration-fast) var(--ease-out)}
.chat-filter-tab-icon svg{width:15px;height:15px;display:block}
.chat-filter-tab-icon:hover{transform:translateY(-1px)}
.chat-filter-tab-icon.active{border-color:transparent;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor}
.chat-thread-list{flex:1;overflow-y:auto}
.chat-thread-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);cursor:pointer;border-bottom:var(--border-width) solid var(--hairline);transition:background-color var(--duration-fast) var(--ease-out)}
.chat-thread-row:hover{background:var(--control-bg)}
.chat-thread-row.active{background:var(--accent-tint)}
.chat-avatar{width:38px;height:38px;border-radius:50%;background-image:var(--grad-primary);color:var(--text-on-grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--text-sm);flex-shrink:0}
.chat-thread-main{flex:1;min-width:0}
.chat-thread-top{display:flex;justify-content:space-between;gap:var(--space-2)}
.chat-thread-name{font-weight:600;font-size:var(--text-compact);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-thread-time{font-size:var(--text-xs);color:var(--text-muted);flex-shrink:0}
.chat-thread-preview{display:flex;align-items:center;gap:var(--space-2);margin-top:2px;font-size:var(--text-sm);color:var(--text-muted);overflow:hidden}
.chat-thread-preview span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-unread-dot{background-image:var(--grad-primary);color:var(--text-on-grad);border-radius:var(--radius-pill);min-width:18px;height:18px;padding:0 5px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-badge{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-badge svg{width:10px;height:10px;display:block}
.chat-ch-sms{background:var(--accent-tint);color:var(--accent-ink)}
.chat-ch-email{background:color-mix(in srgb, oklch(78% 0.12 195) 20%, var(--surface));color:oklch(78% 0.12 195)}
.chat-ch-whatsapp{background:color-mix(in srgb, oklch(74% 0.17 150) 20%, var(--surface));color:oklch(74% 0.17 150)}
.chat-ch-facebook{background:color-mix(in srgb, oklch(62% 0.17 255) 22%, var(--surface));color:oklch(70% 0.14 255)}
.chat-ch-instagram{background:color-mix(in srgb, oklch(65% 0.18 350) 22%, var(--surface));color:oklch(72% 0.15 350)}
.chat-panel{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-panel-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);border-bottom:var(--border-width) solid var(--border)}
.chat-panel-head-main{flex:1;min-width:0}
.chat-panel-name{font-weight:600;font-size:var(--text-compact)}
.chat-panel-handle{font-size:var(--text-xs);color:var(--text-muted)}
.chat-messages{flex:1;overflow-y:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.chat-bubble-row{display:flex}
.chat-bubble-row.out{justify-content:flex-end}
.chat-bubble-row.in{justify-content:flex-start}
.chat-bubble{max-width:60%;border-radius:var(--radius);padding:var(--space-2) var(--space-3);background:var(--control-bg);border:var(--border-width) solid var(--border)}
.chat-bubble-row.out .chat-bubble{background-image:var(--grad-scrim),var(--grad-primary);color:var(--text-on-grad);border-color:transparent}
.chat-bubble-subject{font-weight:700;font-size:var(--text-sm);margin-bottom:2px}
.chat-bubble-body{font-size:var(--text-compact);white-space:pre-wrap;word-break:break-word}
.chat-bubble-meta{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);font-size:var(--text-xs);opacity:.85}
.chat-bubble-row.out .chat-bubble-meta .chat-badge{background:var(--on-grad-rule-strong);color:var(--text-on-grad)}
.chat-compose{display:flex;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-top:var(--border-width) solid var(--border)}
.chat-compose-channel{width:120px;flex-shrink:0;margin-bottom:0}
.chat-compose-input{flex:1;margin-bottom:0}
.compose-channel-toggle{display:flex;gap:var(--space-2);margin-bottom:var(--space-4)}
.compose-channel-toggle button{font-family:inherit;flex:1;border:var(--border-width) solid var(--border-strong);background:var(--control-bg);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4);font-size:var(--text-compact);font-weight:500;cursor:pointer;color:var(--text-muted);transition:background-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
.compose-channel-toggle button:hover:not(.active){background:var(--accent-tint);border-color:var(--accent-ink);color:var(--accent-ink)}
.compose-channel-toggle button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.compose-sms-count{font-size:var(--text-xs);color:var(--text-muted);text-align:right;margin:-10px 0 var(--space-4);font-variant-numeric:tabular-nums}

/* ── Shell collapse: the rail becomes a top strip under 900px ────────── */
@media(max-width:900px){
  .app-shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:none;border-bottom:var(--border-width) solid var(--hairline);padding:var(--space-3) var(--space-3) var(--space-2);gap:var(--space-2)}
  .app-logo{padding:0 var(--space-2);font-size:var(--text-lg)}
  .app-nav{flex-direction:row;overflow-x:auto;gap:var(--space-1);padding-bottom:var(--space-1)}
  .rail-group-label{display:none}
  .app-nav button{border-left:none;border-bottom:var(--border-width-strong) solid transparent;flex-shrink:0}
  .app-nav button.active{border-left-color:transparent;border-bottom-color:var(--accent)}
}
@media(max-width:520px){
  .app-user-name{display:none}
}
</style>

<body>

<!-- Login: the only composed page in the app. Serif headline with one coral
     verb, the filament-chamber apparatus on the blueprint bench, meter strip
     below. data-theme on the GSI widget is Google's own attribute — the only
     styling reach into their cross-origin iframe. filled_black reads as a
     machined slab on the night canvas and stays deliberate on the day one. -->
<div class="login-page" id="login-page">
  <div class="login-grid">
    <div class="login-card">
      <div class="login-eyebrow">DHF Tyres · Workshop desk</div>
      <div class="login-title">the desk that <em>keeps</em> the lights on.</div>
      <div class="login-sub">Sign in with your DHF Tyres account.</div>
      <div id="g_id_onload"
           data-client_id="992833623399-s28cqha40ho2f4s2mvihskiicngb3g5e.apps.googleusercontent.com"
           data-auto_prompt="false"
           data-callback="handleGoogleSignIn">
      </div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-text="sign_in_with" data-shape="pill" data-width="280"></div>
      <div class="login-domain">Restricted to @dhftyres.com.au accounts.</div>
    </div>
    <figure class="apparatus" aria-hidden="true">
      <div class="chamber">
        <span class="chamber-electrode" style="--y:22%"></span>
        <span class="chamber-electrode" style="--y:42%"></span>
        <span class="chamber-electrode" style="--y:62%"></span>
        <span class="chamber-electrode" style="--y:82%"></span>
        <span class="chamber-filament"></span>
        <span class="chamber-glow"></span>
        <span class="chamber-stencil">DHF-01</span>
      </div>
      <ul class="callouts">
        <li class="callout" style="--side:left;--y:20%"><span>Diary → Invoice</span></li>
        <li class="callout" style="--side:right;--y:38%"><span>13 views · one desk</span></li>
        <li class="callout" style="--side:left;--y:62%"><span>Supabase · RLS</span></li>
        <li class="callout" style="--side:right;--y:82%"><span>@dhftyres.com.au</span></li>
      </ul>
    </figure>
  </div>
  <aside class="meter" aria-hidden="true">
    <p class="meter-label">Signal · DHF Desk</p>
    <div class="meter-bars">
      <span style="height:5px"></span><span style="height:8px"></span><span style="height:12px"></span><span style="height:17px"></span><span style="height:22px"></span><span style="height:26px"></span><span style="height:21px"></span><span style="height:15px"></span><span style="height:10px"></span><span style="height:13px"></span><span style="height:18px"></span><span style="height:24px"></span><span style="height:27px"></span><span style="height:23px"></span><span style="height:16px"></span><span style="height:11px"></span><span style="height:7px"></span><span style="height:9px"></span><span style="height:14px"></span><span style="height:20px"></span><span style="height:25px"></span><span style="height:19px"></span><span style="height:12px"></span><span style="height:7px"></span>
    </div>
    <p class="meter-label">Status · Online</p>
  </aside>
</div>

<div class="app" id="app">
  <div class="app-shell">
    <!-- Side rail: grouped nav. app.js toggles .active on #app-nav button by
         data-view — the grouping labels are inert divs, never buttons. -->
    <aside class="rail">
      <div class="app-logo">DHF<span class="app-logo-accent">desk</span></div>
      <div class="app-nav" id="app-nav">
        <div class="rail-group-label">Workshop</div>
        <button data-view="diary" class="active" onclick="switchView('diary')">Diary</button>
        <button data-view="jobs" onclick="switchView('jobs')">Jobs</button>
        <button data-view="customers" onclick="switchView('customers')">Customers &amp; vehicles</button>
        <button data-view="service-schedule" onclick="switchView('service-schedule')">Service due</button>
        <div class="rail-group-label">Money</div>
        <button data-view="invoices" onclick="switchView('invoices')">Invoices</button>
        <button data-view="pos" onclick="switchView('pos')">POS</button>
        <button onclick="location.href='crm.html'">CRM</button>
        <button data-view="pipeline" onclick="switchView('pipeline')">Sales projection</button>
        <button data-view="reports" onclick="switchView('reports')">Reports</button>
        <div class="rail-group-label">Stock</div>
        <button data-view="inventory" onclick="switchView('inventory')">Inventory</button>
        <button data-view="supplier-stock" onclick="switchView('supplier-stock')">Supplier stock</button>
        <div class="rail-group-label">Office</div>
        <button data-view="chats" onclick="switchView('chats')">Chats <span class="rail-badge-demo">DEMO</span></button>
        <button data-view="messages" onclick="switchView('messages')">Messages</button>
        <button data-view="timesheets" onclick="switchView('timesheets')">Timesheets</button>
        <button data-view="settings" onclick="switchView('settings')">Settings</button>
      </div>
    </aside>
    <div class="app-col">
      <div class="app-header">
        <div class="app-right">
          <div class="app-quick">
            <div class="quick-search-wrap">
              <!-- Fixed-size trigger only. The real input and results live in
                   a fixed-position overlay injected by openQuickSearchPanel(). -->
              <button type="button" class="quick-search-trigger" onclick="openQuickSearchPanel()" title="Search (Ctrl+K)" aria-label="Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="quick-search-trigger-label">Search</span><span class="quick-search-kbd" aria-hidden="true">Ctrl K</span>
              </button>
            </div>
            <button class="quick-add-btn" onclick="toggleQuickAddMenu(event)" title="Create">+</button>
          </div>
          <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
          <div class="app-user">
            <span class="app-user-name" id="header-name"></span>
            <button class="app-logout" onclick="handleLogout()">Sign out</button>
          </div>
