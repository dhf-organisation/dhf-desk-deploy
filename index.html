.invoice-items-table th:last-child{border-radius:0 var(--radius-sm) 0 0}
.invoice-items-table td{padding:var(--space-2);font-size:var(--text-compact);border-bottom:var(--border-width) solid var(--border);vertical-align:middle}
.invoice-items-table input,.invoice-items-table select{width:100%;padding:var(--space-2);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color var(--duration-fast) var(--ease),box-shadow var(--duration-fast) var(--ease)}
.invoice-items-table input:focus,.invoice-items-table select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
.invoice-items-table .qty-col,.invoice-items-table .price-col{width:90px}
.invoice-items-table .total-col{width:100px;text-align:right;font-weight:700}
.invoice-items-table .tax-col{width:140px}
.invoice-items-table tr.clickable-row{cursor:pointer}
.invoice-items-table tr.clickable-row:hover{background:var(--accent-tint)}
/* Drag handle column — narrow, centred, inert to pointer events on the cell
   itself (the child span is what's interactive), so clicking an input inside
   the row doesn't accidentally grab the drag handle. */
.invoice-items-table .drag-col{width:28px;padding:var(--space-2) 0 var(--space-2) var(--space-1);text-align:center;vertical-align:middle}
.drag-handle{display:inline-block;cursor:grab;color:var(--text-muted);font-size:13px;letter-spacing:-1px;line-height:1;user-select:none;padding:var(--space-1) 0}
.drag-handle:active{cursor:grabbing}
/* Row states during drag — opacity on the source, a soft accent tint on the
   target. Headers and items share the same states. */
.invoice-items-table tr.dragging{opacity:.4}
.invoice-items-table tr.drag-over{background:var(--accent-tint);box-shadow:inset 0 2px 0 var(--accent)}
/* Section header row — spans all data columns as a single divider. */
.invoice-header-row td{border-bottom:var(--border-width) solid var(--border-strong) !important}
.invoice-header-cell{padding:var(--space-4) 0 var(--space-2) !important;display:flex;align-items:center;gap:var(--space-3)}
.invoice-header-input{font-family:inherit;flex:1;min-width:0;padding:var(--space-2) var(--space-3);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--text);background:var(--control-bg)}
.invoice-header-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
.header-subtotal{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
/* SIGNATURE (Payments): the method-share bars. This is the one place in the
   app with an actual chart, so the gradient goes here rather than on a tab —
   raw --grad-primary, no scrim, because no text sits on these. Rounded caps
   on both the track and the fill, and the fill keeps its own radius so a 3%
   sliver still reads as a rounded bar rather than a sharp splinter. */
.payment-method-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0}
.payment-method-label{width:150px;font-size:var(--text-compact);font-weight:600;flex-shrink:0}
.payment-method-bar-wrap{flex:1;background:var(--bg-alt);border:none;border-radius:var(--radius-pill);height:10px;overflow:hidden}
.payment-method-bar{display:block;height:100%;background-image:var(--grad-primary);border-radius:var(--radius-pill);box-shadow:0 2px 8px rgba(44,95,245,.32)}
.payment-method-amount{width:100px;text-align:right;font-size:var(--text-compact);font-weight:700;flex-shrink:0}
.payment-method-pct{width:44px;text-align:right;font-size:13px;color:var(--text-muted);flex-shrink:0}
.invoice-items-table .del-col{width:32px;text-align:center}
/* SIGNATURE (invoice / quote detail): the totals block. It is already a
   self-contained container in the markup, and Balance Due is unambiguously
   the number the whole screen exists to show — so it becomes the gradient
   card rather than a tab or a button carrying the moment.
   Every descendant colour is re-stated because the shared .field-row rules
   assume a light surface: muted labels and hairline rules would both vanish. */
.invoice-totals{margin-left:auto;max-width:320px;background-image:var(--grad-scrim),var(--grad-primary);color:var(--text-on-grad);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:var(--space-4) var(--space-6)}
.invoice-totals .field-row{border-bottom-color:rgba(255,255,255,.22)}
/* POS puts editable discount inputs inside this card, styled inline in app.js
   with `border:1px solid var(--border)` — a dark hairline at 9% opacity, which
   all but disappears against the gradient. Shadowing --border here re-points
   that inline lookup at a light border without touching app.js. The field-row
   rule above sets its own longhand colour, so it is unaffected. */
.invoice-totals{--border:var(--inset-bg)}
/* Mode-independent on purpose. This field sits ON --grad-primary, and the
   gradient is identical in light and dark, so what sits on it must be too —
   var(--text) would go near-white in dark and vanish into the white field. */
.invoice-totals input{background:#FFFFFF;color:#1A2233}
/* Full white, not a dimmed white: on the azure end of the gradient even 90%
   white only reaches 4.3:1, so hierarchy here is carried by weight and size
   rather than opacity. Labels 500, values 700 — both at the full 4.77:1. */
.invoice-totals .field-label{color:var(--text-on-grad);font-weight:500}
.invoice-totals .field-val{color:var(--text-on-grad);font-weight:700}
.invoice-totals .field-row.grand{border-top-color:rgba(255,255,255,.45)}
.invoice-totals .field-row.grand .field-label{color:var(--text-on-grad);font-weight:700}
/* Now redundant with the global .field-row.grand rule — kept as an empty
   anchor would be worse than removing it, so it's gone. The Invoices pass
   owns whatever this screen needs beyond the shared total row. */
/* NOTE: this component belongs to SETTINGS (renderSettingsPage), not Invoices
   — it is only filed in this block because it previews an invoice template.
   Completed in the Settings pass.
   The preview itself is a miniature of a PRINT document, so it deliberately
   stays flat and near-square while everything around it is soft: glass or a
   gradient here would misrepresent what the customer actually receives. The
   CARD around it is themed; the paper inside it is not. */
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4);margin-top:var(--space-4)}
.template-option-card{border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);padding:var(--space-4);cursor:pointer;background:var(--surface);transition:border-color var(--duration-fast) var(--ease),box-shadow var(--duration-fast) var(--ease)}
.template-option-card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(44,95,245,.18)}
/* Selected state can't rest on the border alone — a 1px colour change is the
   weakest possible "this is the one you chose" on a two-card grid. */
.template-option-card.selected{border-color:var(--accent-ink);background:var(--accent-tint);box-shadow:0 0 0 2px var(--accent),0 8px 22px rgba(44,95,245,.22)}
/* Also mode-independent: this is a miniature of a PRINTED page, and printed
   pages are white in both themes (see the @media print block and the template
   carve-out). Its internals are pinned to literals rather than tokens so a
   dark flip can't turn the "paper" into an ink rectangle or fade the
   skeleton lines into it. */
.template-preview{height:100px;border-radius:6px;margin-bottom:var(--space-2);display:flex;flex-direction:column;overflow:hidden;border:var(--border-width) solid #D8DBE2;background:#FFFFFF}
.template-preview .band{height:24px}
.template-preview .lines{flex:1;padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1)}
.template-preview .lines div{height:5px;background:#C3C8D2;border-radius:2px}
.template-preview.compact .lines div{height:4px}

/* ── Messages ─────────────────────────────────────────────────────────
   A sent-log over a compose modal. The channel marker becomes a tinted pill
   rather than 34px of grey uppercase text.
   Email and SMS share one tint: app.js emits the channel as text content
   ("Email" / "SMS") with no modifier class, and CSS cannot select on text, so
   colouring them apart would need an app.js change — out of scope for a
   presentation pass. Worth doing later; noted rather than faked.
   SIGNATURE: the config banner (below) when messaging is connected. */
.message-row{display:flex;align-items:flex-start;gap:var(--space-3)}
.message-channel-icon{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0;margin-top:1px;width:auto;min-width:46px;text-align:center;padding:3px var(--space-2);border-radius:var(--radius-pill);background:var(--accent-tint);color:var(--accent-ink)}
.message-row-main{flex:1;min-width:0}
.message-row-to{font-weight:600;font-size:var(--text-compact)}
.message-row-subject{font-size:var(--text-compact);font-weight:500;margin-top:2px}
.message-row-preview{font-size:13px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-row-links{font-size:12px;color:var(--text-muted);margin-top:var(--space-1);display:flex;gap:var(--space-2);flex-wrap:wrap}
.message-row-time{font-size:12px;color:var(--text-muted);white-space:nowrap;text-align:right;flex-shrink:0}
/* Same colour-only alignment as the invoice badges — see the note there. */
.status-badge.queued{background:var(--bg-alt);color:var(--text-muted)}
.status-badge.failed{background:var(--danger-tint);color:var(--danger-text)}
/* SIGNATURE: the connected banner. It sits at the top of the screen and is
   the first thing read, so the "all good" state wears the gradient — the one
   moment on a screen that is otherwise a plain log. The warn state
   deliberately does NOT: a problem should read as a problem, so it keeps the
   flat warning tint and gets the emphasis from colour, not shine.
   The warn text uses the AA-safe twin — raw --warning at 13px is 3.15:1 and
   would fail. The ok state is white on gradient+scrim at 4.77:1. */
.message-config-banner{border-radius:var(--radius);padding:var(--space-3) var(--space-4);font-size:13px;font-weight:600;margin-bottom:var(--space-4);border:var(--border-width) solid transparent}
.message-config-banner.ok{background-image:var(--grad-scrim),var(--grad-primary);color:var(--text-on-grad);box-shadow:var(--shadow-soft)}
.message-config-banner.warn{background:var(--warning-tint);color:var(--warning-text);border-color:color-mix(in srgb,var(--warning) 30%,var(--surface))}
.compose-channel-toggle{display:flex;gap:var(--space-2);margin-bottom:var(--space-4)}
.compose-channel-toggle button{font-family:inherit;flex:1;border:var(--border-width) solid var(--border-strong);background:var(--control-bg);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4);font-size:var(--text-compact);font-weight:600;cursor:pointer;color:var(--text-muted);transition:background var(--duration-fast) var(--ease),color var(--duration-fast) var(--ease),border-color var(--duration-fast) var(--ease)}
.compose-channel-toggle button:hover:not(.active){background:var(--accent-tint);border-color:var(--accent-ink);color:var(--accent-ink)}
/* Solid accent, not the gradient: this toggle lives inside the compose modal,
   where the primary Send button already carries the gradient. Two gradients
   in one small dialog would read as decoration rather than emphasis. */
.compose-channel-toggle button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);box-shadow:0 4px 12px rgba(44,95,245,.24)}
.compose-sms-count{font-size:12px;color:var(--text-muted);text-align:right;margin:-10px 0 var(--space-4);font-variant-numeric:tabular-nums}

@media(max-width:900px){
  .app-header{grid-template-columns:auto 1fr;grid-template-areas:"logo right" "nav nav"}
  .app-logo{grid-area:logo}
  .app-right{grid-area:right}
  .app-nav{grid-area:nav;justify-self:stretch}
}
@media(max-width:520px){
  .app-user-name{display:none}
}
</style>
</head>
<body>

<div class="login-page" id="login-page">
  <div class="login-card">
    <div class="login-logo">DHF</div>
    <div class="login-title">DHF Desk</div>
    <div class="login-sub">Sign in with your DHF Tyres account.</div>
    <div id="g_id_onload"
         data-client_id="992833623399-s28cqha40ho2f4s2mvihskiicngb3g5e.apps.googleusercontent.com"
         data-auto_prompt="false"
         data-callback="handleGoogleSignIn">
    </div>
    <!-- data-theme here is Google's own widget attribute, unrelated to the
         app's theme flag. Both values are set by the v4 theme, not inherited:
         filled_black was chosen to avoid punching a white card into the dark
         v3 panel, and now reads as a black slab on light glass — filled_blue
         is the nearest GSI variant to --accent. data-shape follows the
         rounded rule the same way. Google renders the widget in a
         cross-origin iframe, so these attributes are the only styling reach
         we have into it; our CSS cannot touch it. -->
    <div class="g_id_signin" data-type="standard" data-theme="filled_blue" data-size="large" data-text="sign_in_with" data-shape="pill" data-width="280"></div>
    <div class="login-domain">Restricted to @dhftyres.com.au accounts.</div>
  </div>
</div>

<div class="app" id="app">
  <div class="app-header">
    <div class="app-logo">DHF Desk</div>
    <div class="app-nav" id="app-nav">
      <button data-view="diary" class="active" onclick="switchView('diary')">Diary</button>
      <button data-view="jobs" onclick="switchView('jobs')">Jobs</button>
      <button data-view="customers" onclick="switchView('customers')">Customers &amp; vehicles</button>
      <button data-view="invoices" onclick="switchView('invoices')">Invoices</button>
      <button data-view="messages" onclick="switchView('messages')">Messages</button>
      <button data-view="inventory" onclick="switchView('inventory')">Inventory</button>
      <button data-view="supplier-stock" onclick="switchView('supplier-stock')">Supplier Stock</button>
      <button data-view="pos" onclick="switchView('pos')">POS</button>
      <button data-view="service-schedule" onclick="switchView('service-schedule')">Service due</button>
      <button data-view="timesheets" onclick="switchView('timesheets')">Timesheets</button>
      <button data-view="pipeline" onclick="switchView('pipeline')">Sales projection</button>
      <button data-view="reports" onclick="switchView('reports')">Reports</button>
      <button data-view="settings" onclick="switchView('settings')">Settings</button>
    </div>
    <div class="app-right">
      <div class="app-quick">
        <div class="quick-search-wrap">
          <!-- Fixed-size trigger only. The real input and results live in a
               fixed-position overlay injected by openQuickSearchPanel() —
               see the note on .search-palette-backdrop for why. -->
          <button type="button" class="quick-search-trigger" onclick="openQuickSearchPanel()" title="Search (Ctrl+K)" aria-label="Search">
            <span aria-hidden="true">🔍</span><span class="quick-search-trigger-label">Search</span><span class="quick-search-kbd" aria-hidden="true">Ctrl K</span>
          </button>
        </div>
        <button class="quick-add-btn" onclick="toggleQuickAddMenu(event)" title="Create">+</button>
      </div>
      <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <div class="app-user">
        <span class="app-user-name" id="header-name"></span>
        <button class="app-logout" onclick="handleLogout()">Sign out</button>
      </div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="toast" id="toast"></div>
