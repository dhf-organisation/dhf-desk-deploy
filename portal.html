<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHF Tyres — Track your vehicle</title>

<!-- Customer-facing portal (2026-07-27). Deliberately separate from
     index.html/app.js: its own bootstrap, its own auth (Supabase Auth email
     OTP, not the staff Google sign-in), no shared state. A bug here can't
     touch the staff app, and vice versa. Same Supabase project/anon key as
     the staff app — access is scoped entirely by RLS (see
     migration-customer-portal.sql), not by anything this page does.
     Night garage restyle: dark-first, no theme toggle — customers get the
     night canvas, serif headings, brass accent. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">

<style>
/* Hallmark · genre: atmospheric · macrostructure: Long Document · design-system: design.md · designed-as-app
 * nav: N9 minimal brand header · footer: Ft2 inline line · contrast: pass (40–41) · mobile: pass (34, 49–57) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
/* Two quiet blooms — brass top-left, a faint coral chord low right. */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:var(--aurora);background-attachment:fixed}
:focus-visible{outline:var(--border-width-strong) solid var(--focus-solid);outline-offset:2px;border-radius:var(--radius-sm)}
::selection{background:var(--accent);color:var(--accent-text)}

.wrap{max-width:560px;margin:0 auto;padding:var(--space-8) var(--space-4) var(--space-8)}

/* Brand — serif wordmark on a brass chip, mono register line. */
.brand{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-6)}
.brand-mark{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:normal;font-size:17px;letter-spacing:-.01em;box-shadow:var(--shadow-card);flex-shrink:0}
.brand-name{font-family:var(--font-display);font-style:normal;font-size:var(--text-lg);letter-spacing:-.01em}
.brand-sub{font-family:var(--font-data);font-size:10px;font-weight:500;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}

/* Cards — solid, hairline-edged, lit faintly from within. No glass. */
.card{background:var(--surface);background-image:var(--card-emit);border:var(--border-width) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:var(--space-6);margin-bottom:var(--space-4);animation:rise var(--duration) var(--ease-out) both}
.card-solid{background:var(--surface);border:var(--border-width) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:var(--space-6);margin-bottom:var(--space-4)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none !important}}

h1{font-family:var(--font-display);font-style:normal;font-weight:400;font-size:28px;line-height:1.1;letter-spacing:-.01em;margin-bottom:var(--space-2);overflow-wrap:anywhere}
h2{font-family:var(--font-display);font-style:normal;font-weight:400;font-size:var(--text-lg);letter-spacing:-.005em}
p.muted{color:var(--text-muted);font-size:var(--text-sm)}
.form-label{font-size:var(--text-xs);font-weight:500;letter-spacing:.02em;color:var(--text-muted);margin-bottom:var(--space-1);display:block}
.form-input{width:100%;padding:var(--space-3);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;margin-bottom:var(--space-4);background:var(--input-bg);color:var(--text);transition:border-color var(--duration-fast) var(--ease-out)}
.form-input:focus{outline:none;border-color:var(--focus-solid);box-shadow:0 0 0 3px var(--focus-ring)}
.form-input:disabled{opacity:.55;cursor:not-allowed;background:var(--bg-alt)}

.btn-primary{width:100%;font-family:inherit;background:var(--accent);color:var(--accent-text);border:none;border-radius:var(--radius-sm);padding:var(--space-3) var(--space-6);font-size:var(--text-base);font-weight:600;cursor:pointer;transition:background-color var(--duration-fast) var(--ease-out),transform var(--duration-fast) var(--ease-out)}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}
.btn-primary:disabled:hover{background:var(--accent);transform:none}
.btn-link{font-family:inherit;background:none;border:none;color:var(--accent-ink);font-size:var(--text-sm);font-weight:600;cursor:pointer;padding:0}
.btn-link:hover{text-decoration:underline}

.msg{font-size:var(--text-sm);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-4)}
.msg.err{background:var(--danger-tint);color:var(--danger-text)}
.msg.ok{background:var(--success-tint);color:var(--success-text)}

/* Status pills — same tints as the desk's badges, one system. */
.pill{display:inline-block;padding:3px var(--space-3);border-radius:var(--radius-pill);font-size:var(--text-micro);font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.booking{background:var(--accent-tint);color:var(--accent-ink)}
.pill.in_progress{background:var(--warning-tint);color:var(--warning-text)}
.pill.on_hold{background:var(--danger-tint);color:var(--danger-text)}
.pill.finished{background:var(--success-tint);color:var(--success-text)}

.job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);margin-bottom:var(--space-2)}
.job-veh{font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-3)}
.status-note{background:var(--inset-bg);border:var(--border-width) solid var(--border);border-radius:var(--radius-sm);padding:var(--space-3);font-size:var(--text-sm);margin-bottom:var(--space-3)}
.thread{margin-top:var(--space-3);padding-top:var(--space-3);border-top:var(--border-width) solid var(--border)}
.note{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);margin-bottom:var(--space-2);font-size:var(--text-sm);max-width:85%}
.note.staff{background:var(--inset-bg)}
.note.customer{background:var(--accent-tint);margin-left:auto}
.note-meta{font-size:var(--text-micro);color:var(--text-muted);margin-bottom:2px}
.reply-row{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.reply-row input{flex:1;margin-bottom:0}
.reply-row button{flex-shrink:0;width:auto;padding:0 var(--space-4)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)}
.empty{padding:var(--space-8) var(--space-4);color:var(--text-muted)}

/* Ft2 — one inline line closes the page. */
.foot{margin-top:var(--space-8);padding-top:var(--space-4);border-top:var(--border-width) solid var(--hairline);text-align:center;font-family:var(--font-data);font-size:10px;font-weight:500;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">DHF</div>
    <div>
      <div class="brand-name">track your vehicle</div>
      <div class="brand-sub">DHF Tyres</div>
    </div>
  </div>
  <div id="app"><div class="card"><p class="muted">Loading…</p></div></div>
  <div class="foot">DHF Tyres · Workshop desk</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script>
// Environment config — see config.js. Fallbacks are the production values.
const DHF_CFG=window.DHF_CONFIG||{};
const SB_URL=DHF_CFG.supabaseUrl||'https://cztpumgrvhmcvvpqbfqo.supabase.co';
const SB_KEY=DHF_CFG.supabaseKey||'sb_publishable_uj8jlFriz9gRP-eo2vZEZA_u_qIhub3';
const sb=supabase.createClient(SB_URL,SB_KEY);

const STATUS_LABEL={booking:'Booked In',in_progress:'Being Worked On',on_hold:'On Hold',finished:'Ready for Pickup!'};
let pendingEmail=null;

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtDate(iso){return iso?new Date(iso).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):''}

function renderSignIn(errMsg){
  document.getElementById('app').innerHTML=`
    <div class="card">
      <h1>Sign in to check your vehicle</h1>
      <p class="muted" style="margin-bottom:var(--space-4)">We'll email you a one-time code — no password needed.</p>
      ${errMsg?`<div class="msg err">${esc(errMsg)}</div>`:''}
      <label class="form-label">Email address</label>
      <input class="form-input" id="pf-email" type="email" placeholder="you@example.com" autocomplete="email">
      <button class="btn-primary" id="pf-send-btn" onclick="requestCode()">Send me a code</button>
    </div>`;
  document.getElementById('pf-email').focus();
  document.getElementById('pf-email').addEventListener('keydown',e=>{if(e.key==='Enter')requestCode()});
}

function renderCodeEntry(email,errMsg,infoMsg){
  document.getElementById('app').innerHTML=`
    <div class="card">
      <h1>Enter your code</h1>
      <p class="muted" style="margin-bottom:var(--space-4)">We sent a 6-digit code to <strong>${esc(email)}</strong>.</p>
      ${errMsg?`<div class="msg err">${esc(errMsg)}</div>`:''}
      ${infoMsg?`<div class="msg ok">${esc(infoMsg)}</div>`:''}
      <label class="form-label">Code</label>
      <input class="form-input" id="pf-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      <button class="btn-primary" id="pf-verify-btn" onclick="verifyCode()">Verify &amp; continue</button>
      <div style="text-align:center;margin-top:var(--space-4)">
        <button class="btn-link" onclick="requestCode(true)">Resend code</button>
        &nbsp;·&nbsp;
        <button class="btn-link" onclick="renderSignIn()">Use a different email</button>
      </div>
    </div>`;
  document.getElementById('pf-code').focus();
  document.getElementById('pf-code').addEventListener('keydown',e=>{if(e.key==='Enter')verifyCode()});
}

async function requestCode(isResend){
  const email=isResend?pendingEmail:document.getElementById('pf-email').value.trim();
  if(!email){renderSignIn('Enter your email address.');return}
  const btn=document.getElementById(isResend?null:'pf-send-btn');
  if(btn){btn.disabled=true;btn.textContent='Sending…'}
  try{
    // shouldCreateUser: true — a customer has no existing auth.users row on
    // their first-ever visit, so the OTP flow needs to create one. Safe
    // either way: what they can SEE is scoped entirely by RLS matching
    // desk_customers.email, not by whether this call succeeded.
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    if(error)throw error;
    pendingEmail=email;
    renderCodeEntry(email,null,isResend?'Sent again — check your inbox.':null);
  }catch(e){
    renderSignIn(e.message||'Could not send a code — try again.');
  }
}

async function verifyCode(){
  const code=document.getElementById('pf-code').value.trim();
  if(!code){renderCodeEntry(pendingEmail,'Enter the code we emailed you.');return}
  const btn=document.getElementById('pf-verify-btn');
  btn.disabled=true;btn.textContent='Verifying…';
  try{
    const {error}=await sb.auth.verifyOtp({email:pendingEmail,token:code,type:'email'});
    if(error)throw error;
    await loadPortal();
  }catch(e){
    renderCodeEntry(pendingEmail,e.message||'That code didn\'t work — try again.');
  }
}

async function signOutPortal(){
  await sb.auth.signOut();
  pendingEmail=null;
  renderSignIn();
}

async function loadPortal(){
  document.getElementById('app').innerHTML='<div class="card"><p class="muted">Loading your jobs…</p></div>';
  try{
    // RLS (desk_jobs_portal_read / desk_vehicles_portal_read /
    // desk_job_notes_portal_read) scopes every embedded table here to the
    // signed-in customer's own data automatically — this page never filters
    // by identity itself, the database does. A staff-only note is invisible
    // at the ROW level (is_office_only=false is baked into the policy), not
    // hidden by this script choosing not to render it.
    const {data,error}=await sb.from('desk_jobs')
      .select('id,job_type,status,customer_status_note,booked_at,customer:desk_customers(name),vehicle:desk_vehicles(make,model,rego),notes:desk_job_notes(id,body,author_type,created_at)')
      .order('booked_at',{ascending:false});
    if(error)throw error;
    renderJobs(data||[]);
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="card"><div class="msg err">Could not load your jobs — try refreshing the page.</div></div>`;
  }
}

function renderJobs(jobs){
  const name=jobs[0]?.customer?.name;
  let h=`<div class="top-bar">
    <h2>${name?'Hi, '+esc(name.split(' ')[0]):'Your jobs'}</h2>
    <button class="btn-link" onclick="signOutPortal()">Sign out</button>
  </div>`;
  if(!jobs.length){
    h+=`<div class="card-solid empty">We couldn't find any jobs under this email.<br>If that seems wrong, give us a call and we'll sort it out.</div>`;
  }else{
    jobs.forEach(j=>{
      const vehDesc=j.vehicle?[j.vehicle.make,j.vehicle.model].filter(Boolean).join(' ')+(j.vehicle.rego?' ('+j.vehicle.rego+')':''):'';
      const notes=(j.notes||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      h+=`<div class="card-solid">
        <div class="job-head">
          <h2>${esc(j.job_type)}</h2>
          <span class="pill ${j.status}">${STATUS_LABEL[j.status]||j.status}</span>
        </div>
        ${vehDesc?`<div class="job-veh">${esc(vehDesc)}</div>`:''}
        ${j.customer_status_note?`<div class="status-note">${esc(j.customer_status_note)}</div>`:''}
        <div class="thread" id="thread-${j.id}">
          ${notes.length?notes.map(n=>`
            <div class="note ${n.author_type==='customer'?'customer':'staff'}">
              <div class="note-meta">${n.author_type==='customer'?'You':'DHF Tyres'} · ${fmtDate(n.created_at)}</div>
              ${esc(n.body)}
            </div>`).join(''):'<p class="muted" style="font-size:12px">No messages yet.</p>'}
        </div>
        <div class="reply-row">
          <input class="form-input" id="reply-${j.id}" placeholder="Ask a question…">
          <button class="btn-primary" style="width:auto" onclick="sendReply('${j.id}')">Send</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('app').innerHTML=h;
}

async function sendReply(jobId){
  const input=document.getElementById('reply-'+jobId);
  const body=input.value.trim();
  if(!body)return;
  input.disabled=true;
  try{
    // author_type/is_office_only are forced server-side by
    // trg_enforce_portal_note_fields regardless of what's sent here — this
    // insert cannot mark itself staff-only or spoof staff authorship.
    const {error}=await sb.from('desk_job_notes').insert({job_id:jobId,body});
    if(error)throw error;
    await loadPortal();
  }catch(e){
    input.disabled=false;
    alert('Could not send that — try again.');
  }
}

(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){await loadPortal()}else{renderSignIn()}
})();
</script>
</body>
</html>
