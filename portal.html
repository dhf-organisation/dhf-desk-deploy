<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHF Tyres — Track your vehicle</title>

<!-- Customer-facing portal (2026-07-27). Deliberately separate from
     index.html/app.js: its own bootstrap, its own auth (Supabase Auth email
     OTP, not the staff Google sign-in), no shared state. A bug here can't
     touch the staff app, and vice versa. Same Supabase project/anon key as
     the staff app — access is scoped entirely by RLS (see
     migration-customer-portal.sql), not by anything this page does. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F5F7; --bg-alt:#EDEEF2; --surface:#FFFFFF;
  --glass:rgba(255,255,255,.60); --glass-border:rgba(255,255,255,.75); --glass-solid:rgba(255,255,255,.88);
  --blur:blur(16px);
  --grad-primary:linear-gradient(135deg,#1F90F7 0%,#2C5FF5 45%,#6D5FFF 100%);
  --grad-scrim:linear-gradient(135deg,rgba(10,16,48,.22) 0%,rgba(10,16,48,.06) 100%);
  --accent:#2C5FF5; --accent-ink:#2C5FF5; --accent-tint:color-mix(in srgb, var(--accent) 10%, var(--surface));
  --text:#1A2233; --text-muted:#6B7280; --text-on-grad:#FFFFFF;
  --success:#16A34A; --success-text:#14803C; --success-tint:color-mix(in srgb, var(--success) 12%, var(--surface));
  --warning:#D97706; --warning-text:#B45309; --warning-tint:color-mix(in srgb, var(--warning) 12%, var(--surface));
  --danger:#DC2626; --danger-text:#DC2626; --danger-tint:color-mix(in srgb, var(--danger) 10%, var(--surface));
  --border:rgba(26,34,51,.09); --border-strong:#8A91A0;
  --shadow-soft:0 12px 32px rgba(44,95,245,.18); --shadow-card:0 4px 16px rgba(26,34,51,.08);
  --radius:20px; --radius-sm:12px; --radius-pill:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --font:"Plus Jakarta Sans",system-ui,sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1); --duration:260ms;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-attachment:fixed;background-image:
  radial-gradient(46% 44% at 4% 0%,   rgba(31,144,247,.32), transparent 68%),
  radial-gradient(42% 40% at 96% 4%,  rgba(109,95,255,.26), transparent 68%),
  radial-gradient(50% 34% at 72% 96%, rgba(164,93,235,.18), transparent 70%)}
.wrap{max-width:560px;margin:0 auto;padding:var(--space-8) var(--space-4) var(--space-8)}
.brand{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-6)}
.brand-mark{width:44px;height:44px;border-radius:var(--radius-sm);background-image:var(--grad-scrim),var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:var(--shadow-soft)}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand-sub{font-size:13px;color:var(--text-muted)}
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:var(--space-6);margin-bottom:var(--space-4);animation:rise var(--duration) var(--ease) both}
.card-solid{background:var(--glass-solid);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:var(--space-6);margin-bottom:var(--space-4)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:var(--space-2)}
h2{font-size:17px;font-weight:700;letter-spacing:-.005em}
p.muted{color:var(--text-muted);font-size:13px}
.form-label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-muted);margin-bottom:var(--space-1);display:block}
.form-input{width:100%;padding:var(--space-3);border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;margin-bottom:var(--space-4);background:#fff;color:var(--text)}
.form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(44,95,245,.15)}
.btn-primary{width:100%;font-family:inherit;background-image:var(--grad-scrim),var(--grad-primary);color:#fff;border:none;border-radius:var(--radius-pill);padding:var(--space-3) var(--space-6);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(44,95,245,.28)}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-link{font-family:inherit;background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0}
.msg{font-size:13px;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-4)}
.msg.err{background:var(--danger-tint);color:var(--danger-text)}
.msg.ok{background:var(--success-tint);color:var(--success-text)}
.pill{display:inline-block;padding:4px var(--space-3);border-radius:var(--radius-pill);font-size:12px;font-weight:700}
.pill.booking{background:var(--accent-tint);color:var(--accent)}
.pill.in_progress{background:var(--warning-tint);color:var(--warning-text)}
.pill.on_hold{background:var(--danger-tint);color:var(--danger-text)}
.pill.finished{background:var(--success-tint);color:var(--success-text)}
.job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);margin-bottom:var(--space-2)}
.job-veh{font-size:13px;color:var(--text-muted);margin-bottom:var(--space-3)}
.status-note{background:var(--bg-alt);border-radius:var(--radius-sm);padding:var(--space-3);font-size:13px;margin-bottom:var(--space-3)}
.thread{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--border)}
.note{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);margin-bottom:var(--space-2);font-size:13px;max-width:85%}
.note.staff{background:var(--bg-alt)}
.note.customer{background:var(--accent-tint);margin-left:auto}
.note-meta{font-size:11px;color:var(--text-muted);margin-bottom:2px}
.reply-row{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.reply-row input{flex:1;margin-bottom:0}
.reply-row button{flex-shrink:0;width:auto;padding:0 var(--space-4)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)}
.empty{text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">DHF</div>
    <div>
      <div class="brand-name">Track your vehicle</div>
      <div class="brand-sub">DHF Tyres</div>
    </div>
  </div>
  <div id="app"><div class="card"><p class="muted">Loading…</p></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://cztpumgrvhmcvvpqbfqo.supabase.co';
const SB_KEY='sb_publishable_uj8jlFriz9gRP-eo2vZEZA_u_qIhub3';
const sb=supabase.createClient(SB_URL,SB_KEY);

const STATUS_LABEL={booking:'Booked In',in_progress:'Being Worked On',on_hold:'On Hold',finished:'Ready for Pickup!'};
let pendingEmail=null;

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtDate(iso){return iso?new Date(iso).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):''}

function renderSignIn(errMsg){
  document.getElementById('app').innerHTML=`
    <div class="card">
      <h1>Sign in to check your vehicle</h1>
      <p class="muted" style="margin-bottom:var(--space-4)">We'll email you a one-time code — no password needed.</p>
      ${errMsg?`<div class="msg err">${esc(errMsg)}</div>`:''}
      <label class="form-label">Email address</label>
      <input class="form-input" id="pf-email" type="email" placeholder="you@example.com" autocomplete="email">
      <button class="btn-primary" id="pf-send-btn" onclick="requestCode()">Send me a code</button>
    </div>`;
  document.getElementById('pf-email').focus();
  document.getElementById('pf-email').addEventListener('keydown',e=>{if(e.key==='Enter')requestCode()});
}

function renderCodeEntry(email,errMsg,infoMsg){
  document.getElementById('app').innerHTML=`
    <div class="card">
      <h1>Enter your code</h1>
      <p class="muted" style="margin-bottom:var(--space-4)">We sent a 6-digit code to <strong>${esc(email)}</strong>.</p>
      ${errMsg?`<div class="msg err">${esc(errMsg)}</div>`:''}
      ${infoMsg?`<div class="msg ok">${esc(infoMsg)}</div>`:''}
      <label class="form-label">Code</label>
      <input class="form-input" id="pf-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      <button class="btn-primary" id="pf-verify-btn" onclick="verifyCode()">Verify &amp; continue</button>
      <div style="text-align:center;margin-top:var(--space-4)">
        <button class="btn-link" onclick="requestCode(true)">Resend code</button>
        &nbsp;·&nbsp;
        <button class="btn-link" onclick="renderSignIn()">Use a different email</button>
      </div>
    </div>`;
  document.getElementById('pf-code').focus();
  document.getElementById('pf-code').addEventListener('keydown',e=>{if(e.key==='Enter')verifyCode()});
}

async function requestCode(isResend){
  const email=isResend?pendingEmail:document.getElementById('pf-email').value.trim();
  if(!email){renderSignIn('Enter your email address.');return}
  const btn=document.getElementById(isResend?null:'pf-send-btn');
  if(btn){btn.disabled=true;btn.textContent='Sending…'}
  try{
    // shouldCreateUser: true — a customer has no existing auth.users row on
    // their first-ever visit, so the OTP flow needs to create one. Safe
    // either way: what they can SEE is scoped entirely by RLS matching
    // desk_customers.email, not by whether this call succeeded.
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    if(error)throw error;
    pendingEmail=email;
    renderCodeEntry(email,null,isResend?'Sent again — check your inbox.':null);
  }catch(e){
    renderSignIn(e.message||'Could not send a code — try again.');
  }
}

async function verifyCode(){
  const code=document.getElementById('pf-code').value.trim();
  if(!code){renderCodeEntry(pendingEmail,'Enter the code we emailed you.');return}
  const btn=document.getElementById('pf-verify-btn');
  btn.disabled=true;btn.textContent='Verifying…';
  try{
    const {error}=await sb.auth.verifyOtp({email:pendingEmail,token:code,type:'email'});
    if(error)throw error;
    await loadPortal();
  }catch(e){
    renderCodeEntry(pendingEmail,e.message||'That code didn\'t work — try again.');
  }
}

async function signOutPortal(){
  await sb.auth.signOut();
  pendingEmail=null;
  renderSignIn();
}

async function loadPortal(){
  document.getElementById('app').innerHTML='<div class="card"><p class="muted">Loading your jobs…</p></div>';
  try{
    // RLS (desk_jobs_portal_read / desk_vehicles_portal_read /
    // desk_job_notes_portal_read) scopes every embedded table here to the
    // signed-in customer's own data automatically — this page never filters
    // by identity itself, the database does. A staff-only note is invisible
    // at the ROW level (is_office_only=false is baked into the policy), not
    // hidden by this script choosing not to render it.
    const {data,error}=await sb.from('desk_jobs')
      .select('id,job_type,status,customer_status_note,booked_at,customer:desk_customers(name),vehicle:desk_vehicles(make,model,rego),notes:desk_job_notes(id,body,author_type,created_at)')
      .order('booked_at',{ascending:false});
    if(error)throw error;
    renderJobs(data||[]);
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="card"><div class="msg err">Could not load your jobs — try refreshing the page.</div></div>`;
  }
}

function renderJobs(jobs){
  const name=jobs[0]?.customer?.name;
  let h=`<div class="top-bar">
    <h2>${name?'Hi, '+esc(name.split(' ')[0]):'Your jobs'}</h2>
    <button class="btn-link" onclick="signOutPortal()">Sign out</button>
  </div>`;
  if(!jobs.length){
    h+=`<div class="card-solid empty">We couldn't find any jobs under this email.<br>If that seems wrong, give us a call and we'll sort it out.</div>`;
  }else{
    jobs.forEach(j=>{
      const vehDesc=j.vehicle?[j.vehicle.make,j.vehicle.model].filter(Boolean).join(' ')+(j.vehicle.rego?' ('+j.vehicle.rego+')':''):'';
      const notes=(j.notes||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      h+=`<div class="card-solid">
        <div class="job-head">
          <h2>${esc(j.job_type)}</h2>
          <span class="pill ${j.status}">${STATUS_LABEL[j.status]||j.status}</span>
        </div>
        ${vehDesc?`<div class="job-veh">${esc(vehDesc)}</div>`:''}
        ${j.customer_status_note?`<div class="status-note">${esc(j.customer_status_note)}</div>`:''}
        <div class="thread" id="thread-${j.id}">
          ${notes.length?notes.map(n=>`
            <div class="note ${n.author_type==='customer'?'customer':'staff'}">
              <div class="note-meta">${n.author_type==='customer'?'You':'DHF Tyres'} · ${fmtDate(n.created_at)}</div>
              ${esc(n.body)}
            </div>`).join(''):'<p class="muted" style="font-size:12px">No messages yet.</p>'}
        </div>
        <div class="reply-row">
          <input class="form-input" id="reply-${j.id}" placeholder="Ask a question…">
          <button class="btn-primary" style="width:auto" onclick="sendReply('${j.id}')">Send</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('app').innerHTML=h;
}

async function sendReply(jobId){
  const input=document.getElementById('reply-'+jobId);
  const body=input.value.trim();
  if(!body)return;
  input.disabled=true;
  try{
    // author_type/is_office_only are forced server-side by
    // trg_enforce_portal_note_fields regardless of what's sent here — this
    // insert cannot mark itself staff-only or spoof staff authorship.
    const {error}=await sb.from('desk_job_notes').insert({job_id:jobId,body});
    if(error)throw error;
    await loadPortal();
  }catch(e){
    input.disabled=false;
    alert('Could not send that — try again.');
  }
}

(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){await loadPortal()}else{renderSignIn()}
})();
</script>
</body>
</html>
