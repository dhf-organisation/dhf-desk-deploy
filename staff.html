<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DHF Desk — Staff</title>

<!-- Staff mobile app (2026-07-28). Same site, same Supabase project, and the
     SAME Google Sign-In staff already use in index.html/app.js (same
     data-client_id, same ALLOWED_DOMAIN/ALLOWED_EMAILS check) — this page
     lives on the same origin, so no new Google Cloud Console authorization
     is needed, unlike portal.html's new OTP provider. Deliberately its own
     bootstrap, not a mobile view bolted onto app.js: no shared state, a bug
     here can't touch the desktop app or vice versa.
     Night garage restyle: dark-first canvas, brass accent, serif headings.
     Tab icons are inline SVG (one set, stroke matched to type) — the emoji
     glyphs are retired. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DHF Staff">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E2942C'/%3E%3Ctext x='50' y='62' font-family='Georgia,serif' font-size='34' fill='%231A1526' text-anchor='middle'%3EDHF%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">

<style>
/* Hallmark · genre: atmospheric · macrostructure: Workbench (mobile variant) · design-system: design.md · designed-as-app
 * nav: bottom tab bar · footer: none (app) · contrast: pass (40–41) · mobile: pass (34, 49–57) */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:var(--aurora);background-attachment:fixed}
:focus-visible{outline:var(--border-width-strong) solid var(--focus-solid);outline-offset:2px;border-radius:var(--radius-sm)}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
h1{font-family:var(--font-display);font-style:normal;font-weight:400;font-size:var(--text-xl);letter-spacing:-.01em;text-transform:lowercase;overflow-wrap:anywhere;min-width:0}
h2{font-family:var(--font-display);font-style:normal;font-weight:400;font-size:var(--text-lg);letter-spacing:-.005em;overflow-wrap:anywhere;min-width:0}
p.muted{color:var(--text-muted);font-size:var(--text-sm)}
.brand{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-6) var(--space-4) var(--space-4)}
.brand-mark{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:normal;font-size:17px;letter-spacing:-.01em;box-shadow:var(--shadow-card);flex-shrink:0}
.brand-name{font-size:var(--text-lg);text-transform:none}
.brand-accent{color:var(--accent)}
.brand-sub{font-family:var(--font-data);font-size:10px;font-weight:500;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary);margin-top:2px}

/* Sign-in */
.signin-card{margin:var(--space-8) var(--space-4);background:var(--surface);background-image:var(--card-emit);border:var(--border-width) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:var(--space-6);text-align:center}
#g_id_onload,.g_id_signin{display:flex;justify-content:center;margin-top:var(--space-4)}

/* App shell: content scrolls, tab bar pinned to the bottom (thumb reach) */
.screen{flex:1;overflow-y:auto;padding:var(--space-4);padding-bottom:calc(80px + var(--space-4))}
.topbar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-2);position:sticky;top:0;background:var(--header-bg);border-bottom:var(--border-width) solid var(--hairline);z-index:5}
.topbar h1{flex:1}
.back-btn{font-family:inherit;background:none;border:none;font-size:20px;color:var(--accent-ink);cursor:pointer;padding:var(--space-1)}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:var(--header-bg);border-top:var(--border-width) solid var(--hairline);padding:var(--space-2) var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom))}
.tabbar button{flex:1;font-family:inherit;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--space-2);border-radius:var(--radius-sm);font-size:var(--text-micro);font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap}
.tabbar button.active{color:var(--accent-ink);background:var(--accent-tint)}
.tabbar .icon{width:20px;height:20px;display:block}

/* Cards / lists — solid, hairline, no glass */
.card{background:var(--surface);border:var(--border-width) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:var(--space-4);margin-bottom:var(--space-3)}
.card:active{transform:scale(.98)}
.job-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);margin-bottom:var(--space-1)}
.job-sub{font-size:var(--text-sm);color:var(--text-muted)}
.pill{display:inline-block;padding:4px var(--space-3);border-radius:var(--radius-pill);font-size:var(--text-micro);font-weight:700;white-space:nowrap}
.pill.booking{background:var(--accent-tint);color:var(--accent-ink)}
.pill.in_progress{background:var(--warning-tint);color:var(--warning-text)}
.pill.on_hold{background:var(--danger-tint);color:var(--danger-text)}
.pill.finished{background:var(--success-tint);color:var(--success-text)}
.pill.clocked-in{background:var(--success-tint);color:var(--success-text)}
.progress-row{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-muted)}
.progress-track{flex:1;height:6px;border-radius:var(--radius-pill);background:var(--bg-alt);overflow:hidden}
.progress-fill{height:100%;background:var(--accent)}
.empty{padding:var(--space-8) var(--space-4);color:var(--text-muted)}

/* Job detail */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-4)}
.status-btn{font-family:inherit;border:var(--border-width) solid var(--border-strong);background:var(--control-bg);border-radius:var(--radius-sm);padding:var(--space-3);font-size:var(--text-sm);font-weight:600;color:var(--text);cursor:pointer}
.status-btn.current{background-image:var(--grad-primary);color:var(--text-on-grad);border-color:transparent}
.clock-btn{width:100%;font-family:inherit;border:none;border-radius:var(--radius-sm);padding:var(--space-3);font-size:var(--text-base);font-weight:700;cursor:pointer;margin-bottom:var(--space-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock-btn.in{background:var(--accent);color:var(--accent-text)}
.clock-btn.out{background:var(--danger-tint);color:var(--danger-text)}
.checklist-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:var(--border-width) solid var(--border)}
.checklist-item:last-child{border-bottom:none}
.checklist-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0}
.checklist-item.done label{color:var(--text-muted);text-decoration:line-through}
.checklist-header{font-family:var(--font-data);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-tertiary);padding:var(--space-4) 0 var(--space-1);border-bottom:var(--border-width) solid var(--border-strong)}
.checklist-item label{flex:1;min-width:0}
.checklist-uploads{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}
.checklist-thumb{width:36px;height:36px;object-fit:cover;border-radius:var(--radius-sm);border:var(--border-width) solid var(--border);display:block}
.checklist-file{font-size:16px;text-decoration:none}
.checklist-upload-btn{cursor:pointer;font-size:18px;color:var(--text-muted);padding:var(--space-1);line-height:1}
.checklist-upload-btn:active{color:var(--accent-ink)}
.checklist-upload{position:relative;display:inline-flex}
.checklist-upload-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.note{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);margin-bottom:var(--space-2);font-size:var(--text-sm);max-width:88%}
.note.staff-office{background:var(--inset-bg)}
.note.staff-visible{background:var(--accent-tint)}
.note.customer{background:var(--warning-tint);margin-left:auto}
.note-meta{font-size:var(--text-micro);color:var(--text-muted);margin-bottom:2px}
.form-input,.form-select{width:100%;padding:var(--space-3);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;margin-bottom:var(--space-3);background:var(--input-bg);color:var(--text);transition:border-color var(--duration-fast) var(--ease-out)}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--focus-solid);box-shadow:0 0 0 3px var(--focus-ring)}
.form-label{font-size:var(--text-xs);font-weight:500;color:var(--text-muted);margin-bottom:var(--space-1);display:block}
.btn-primary{width:100%;font-family:inherit;background:var(--accent);color:var(--accent-text);border:none;border-radius:var(--radius-sm);padding:var(--space-3);font-size:var(--text-base);font-weight:600;cursor:pointer;transition:background-color var(--duration-fast) var(--ease-out)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.55;cursor:default}
.check-row{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-3)}
.section-title{font-family:var(--font-data);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-tertiary);margin:var(--space-4) 0 var(--space-2)}

/* Diary day nav */
.day-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)}
.day-nav button{font-family:inherit;background:var(--control-bg);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-sm);width:36px;height:36px;font-size:16px;color:var(--text);cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="brand"><div class="brand-mark">DHF</div><div><h1 class="brand-name">DHF<span class="brand-accent">desk</span></h1><div class="brand-sub">Staff</div></div></div>
  <div id="app" style="flex:1;display:flex;flex-direction:column"><div class="screen"><p class="muted">Loading…</p></div></div>
</div>
<div class="toast" id="toast" style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-text);padding:var(--space-2) var(--space-6);border-radius:var(--radius-pill);font-size:var(--text-sm);font-weight:600;opacity:0;pointer-events:none;transition:opacity var(--duration) var(--ease-out);z-index:999;box-shadow:var(--shadow-pop)"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://cztpumgrvhmcvvpqbfqo.supabase.co';
const SB_KEY='sb_publishable_uj8jlFriz9gRP-eo2vZEZA_u_qIhub3';
const sb=supabase.createClient(SB_URL,SB_KEY);

// Same allowlist as app.js — deliberately kept identical, not re-derived,
// so "who counts as staff" can never drift between the two apps.
const ALLOWED_DOMAIN='dhftyres.com.au';
const ALLOWED_EMAILS=['dushentissera@gmail.com'];

const STATUS_LABEL={booking:'Booking',in_progress:'In Progress',on_hold:'On Hold',finished:'Finished'};
const STATUS_ORDER=['booking','in_progress','on_hold','finished'];

let currentUser=null;   // {email, name}
let myEmployee=null;    // desk_employees row matching currentUser.email, or null
let activeTab='jobs';    // 'jobs' | 'diary'
let diaryDate=new Date();
let currentJobId=null;   // set while a job-detail screen is open

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtTime(iso){return iso?new Date(iso).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}):''}
function fmtDateShort(d){return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}
function isoDateOnly(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2200)}

// ── Auth — mirrors app.js's handleGoogleSignIn/enterSession exactly ──
async function handleGoogleSignIn(r){
  try{
    const {data,error}=await sb.auth.signInWithIdToken({provider:'google',token:r.credential});
    if(error||!data.user){showToast('Sign-in failed');google.accounts.id.disableAutoSelect();return}
    await enterSession(data.user);
  }catch(e){showToast('Sign-in failed')}
}
async function enterSession(user){
  const email=user.email||'',domain=email.split('@')[1]||'';
  if(domain!==ALLOWED_DOMAIN&&!ALLOWED_EMAILS.includes(email)){
    showToast('Access denied for '+(email||'(no email returned)'));
    google.accounts.id.disableAutoSelect();
    await sb.auth.signOut();
    return;
  }
  currentUser={email,name:user.user_metadata?.full_name||user.user_metadata?.name||email.split('@')[0]};
  try{
    const {data}=await sb.from('desk_employees').select('id,name,email').eq('email',email).maybeSingle();
    myEmployee=data||null;
  }catch(e){myEmployee=null}
  renderShell();
}
async function signOutStaff(){
  google.accounts.id.disableAutoSelect();
  await sb.auth.signOut();
  currentUser=null;myEmployee=null;
  renderSignIn();
}

function renderSignIn(){
  document.getElementById('app').innerHTML=`
    <div class="signin-card">
      <h1>Sign in</h1>
      <p class="muted" style="margin-top:var(--space-2)">Use your DHF Tyres Google account.</p>
      <div id="g_id_onload"
           data-client_id="992833623399-s28cqha40ho2f4s2mvihskiicngb3g5e.apps.googleusercontent.com"
           data-auto_prompt="false"
           data-callback="handleGoogleSignIn"></div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-text="sign_in_with" data-shape="pill"></div>
    </div>`;
}

// ── Shell: tab bar + routed content ──
function renderShell(){
  document.getElementById('app').innerHTML=`<div id="screen-host" style="flex:1;display:flex;flex-direction:column"></div>
    <nav class="tabbar" id="tabbar">
      <button class="${activeTab==='jobs'?'active':''}" onclick="switchTab('jobs')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>My Jobs</button>
      <button class="${activeTab==='diary'?'active':''}" onclick="switchTab('diary')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Diary</button>
    </nav>`;
  switchTab(activeTab);
}
function switchTab(tab){
  activeTab=tab;currentJobId=null;
  document.querySelectorAll('.tabbar button').forEach((b,i)=>b.classList.toggle('active',(i===0)===(tab==='jobs')));
  if(tab==='jobs')renderMyJobs();else renderDiaryDay();
}

// ── My Jobs ──
async function renderMyJobs(){
  const host=document.getElementById('screen-host');
  host.innerHTML=`<div class="topbar"><h1>My Jobs</h1></div><div class="screen" id="jobs-list"><p class="muted">Loading…</p></div>`;
  if(!myEmployee){
    document.getElementById('jobs-list').innerHTML=`<div class="card empty">Your account isn't linked to a staff record yet.<br>Ask the office to add ${esc(currentUser.email)} to your Employee profile in Settings.</div>`;
    return;
  }
  try{
    const {data,error}=await sb.from('desk_jobs')
      .select('id,job_type,status,booked_at,customer_status_note,customer:desk_customers(name),vehicle:desk_vehicles(make,model,rego),checklist:desk_job_checklist_items(is_complete)')
      .eq('assigned_employee_id',myEmployee.id).eq('is_deleted',false)
      .order('booked_at',{ascending:true});
    if(error)throw error;
    const openEntries=await myOpenClockEntries();
    renderJobList('jobs-list',data||[],openEntries,"No jobs assigned to you right now.");
  }catch(e){
    document.getElementById('jobs-list').innerHTML=`<div class="card empty">Could not load your jobs.</div>`;
  }
}
async function myOpenClockEntries(){
  if(!myEmployee)return{};
  try{
    const {data}=await sb.from('desk_job_time_entries').select('job_id').eq('employee_id',myEmployee.id).is('clock_out',null);
    const m={};(data||[]).forEach(r=>m[r.job_id]=true);return m;
  }catch(e){return{}}
}
function renderJobList(hostId,jobs,openEntries,emptyMsg){
  const host=document.getElementById(hostId);
  if(!jobs.length){host.innerHTML=`<div class="card empty">${emptyMsg}</div>`;return}
  host.innerHTML=jobs.map(j=>{
    const vehDesc=j.vehicle?[j.vehicle.make,j.vehicle.model].filter(Boolean).join(' ')+(j.vehicle.rego?' ('+j.vehicle.rego+')':''):'';
    const done=(j.checklist||[]).filter(c=>c.is_complete).length,total=(j.checklist||[]).length;
    const pct=total?Math.round(done/total*100):0;
    return `<div class="card" onclick="openJobDetail('${j.id}')">
      <div class="job-row">
        <div><strong>${esc(j.job_type)}</strong><div class="job-sub">${esc(j.customer?.name||'—')}${vehDesc?' · '+esc(vehDesc):''}</div></div>
        <div style="text-align:right;flex-shrink:0">
          <span class="pill ${j.status}">${STATUS_LABEL[j.status]}</span>
          ${openEntries&&openEntries[j.id]?'<div class="pill clocked-in" style="margin-top:4px">⏱ Clocked in</div>':''}
        </div>
      </div>
      ${j.booked_at?`<div class="job-sub">${fmtTime(j.booked_at)}</div>`:''}
      ${j.customer_status_note?`<div class="job-sub" style="margin-top:var(--space-2)">${esc(j.customer_status_note)}</div>`:''}
      ${total?`<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span>${done}/${total}</span></div>`:''}
    </div>`;
  }).join('');
}

// ── Diary (day at a time, every job, not just mine) ──
function renderDiaryDay(){
  const host=document.getElementById('screen-host');
  const label=fmtDateShort(diaryDate);
  host.innerHTML=`<div class="topbar" style="flex-direction:column;align-items:stretch">
      <h1 style="margin-bottom:var(--space-2)">Diary</h1>
      <div class="day-nav">
        <button onclick="shiftDiaryDay(-1)">←</button>
        <strong>${label}</strong>
        <button onclick="shiftDiaryDay(1)">→</button>
      </div>
    </div>
    <div class="screen" id="diary-list"><p class="muted">Loading…</p></div>`;
  loadDiaryDay();
}
function shiftDiaryDay(delta){diaryDate=new Date(diaryDate);diaryDate.setDate(diaryDate.getDate()+delta);renderDiaryDay()}
async function loadDiaryDay(){
  const dateStr=isoDateOnly(diaryDate);
  const nextDay=new Date(diaryDate);nextDay.setDate(nextDay.getDate()+1);
  try{
    const {data,error}=await sb.from('desk_jobs')
      .select('id,job_type,status,booked_at,customer_status_note,customer:desk_customers(name),vehicle:desk_vehicles(make,model,rego),checklist:desk_job_checklist_items(is_complete)')
      .eq('is_deleted',false).gte('booked_at',dateStr).lt('booked_at',isoDateOnly(nextDay))
      .order('booked_at',{ascending:true});
    if(error)throw error;
    renderJobList('diary-list',data||[],null,'Nothing booked this day.');
  }catch(e){
    document.getElementById('diary-list').innerHTML=`<div class="card empty">Could not load the diary.</div>`;
  }
}

// ── Job detail ──
async function openJobDetail(jobId){
  currentJobId=jobId;
  const host=document.getElementById('screen-host');
  host.innerHTML=`<div class="topbar"><button class="back-btn" onclick="switchTab(activeTab)">←</button><h1>Job</h1></div><div class="screen" id="job-detail"><p class="muted">Loading…</p></div>`;
  await loadJobDetail(jobId);
}
async function loadJobDetail(jobId){
  try{
    const [{data:job,error},{data:openEntry}]=await Promise.all([
      sb.from('desk_jobs').select('id,job_type,status,booked_at,customer_status_note,customer:desk_customers(name,mobile,phone),vehicle:desk_vehicles(make,model,rego),checklist:desk_job_checklist_items(id,label,is_complete,is_header,sort_order,uploads:desk_checklist_item_uploads(id,file_path,file_name,content_type)),notes:desk_job_notes(id,body,is_office_only,author_type,created_at)').eq('id',jobId).single(),
      myEmployee?sb.from('desk_job_time_entries').select('id,clock_in').eq('job_id',jobId).eq('employee_id',myEmployee.id).is('clock_out',null).maybeSingle():Promise.resolve({data:null})
    ]);
    if(error)throw error;
    // The uploads bucket is private — sign short-lived URLs for any files
    // attached to checklist items before rendering.
    const uploadPaths=[];
    (job.checklist||[]).forEach(c=>(c.uploads||[]).forEach(u=>uploadPaths.push(u.file_path)));
    const uploadUrls={};
    if(uploadPaths.length){
      const {data:signed}=await sb.storage.from('desk-checklist-uploads').createSignedUrls(uploadPaths,3600);
      (signed||[]).forEach(s=>{if(s.path&&s.signedUrl)uploadUrls[s.path]=s.signedUrl});
    }
    renderJobDetail(job,openEntry,uploadUrls);
  }catch(e){
    document.getElementById('job-detail').innerHTML=`<div class="card empty">Could not load this job.</div>`;
  }
}
function renderJobDetail(j,openEntry,uploadUrls){
  const vehDesc=j.vehicle?[j.vehicle.make,j.vehicle.model].filter(Boolean).join(' ')+(j.vehicle.rego?' ('+j.vehicle.rego+')':''):'';
  const checklist=(j.checklist||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
  const notes=(j.notes||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  document.getElementById('job-detail').innerHTML=`
    <div class="card">
      <h2>${esc(j.job_type)}</h2>
      <p class="job-sub" style="margin-top:4px">${esc(j.customer?.name||'—')}${vehDesc?' · '+esc(vehDesc):''}</p>
      ${j.customer?.mobile?`<p class="job-sub">📞 ${esc(j.customer.mobile)}</p>`:''}
      ${j.customer_status_note?`<div class="job-sub" style="margin-top:var(--space-2);background:var(--inset-bg);padding:var(--space-2);border-radius:var(--radius-sm)">${esc(j.customer_status_note)}</div>`:''}
    </div>

    <div class="section-title">Status</div>
    <div class="status-grid">
      ${STATUS_ORDER.map(s=>`<button class="status-btn ${s===j.status?'current':''}" onclick="setJobStatusMobile('${j.id}','${s}')">${STATUS_LABEL[s]}</button>`).join('')}
    </div>

    ${myEmployee?`
    <button class="clock-btn ${openEntry?'out':'in'}" onclick="${openEntry?`clockOut('${openEntry.id}')`:`clockIn('${j.id}')`}">
      ${openEntry?'⏹ Clock Out (started '+fmtTime(openEntry.clock_in)+')':'▶ Clock In'}
    </button>`:''}

    <div class="section-title">Checklist</div>
    <div class="card">
      ${checklist.length?checklist.map(c=>c.is_header?`
        <div class="checklist-header">${esc(c.label)}</div>`:`
        <div class="checklist-item ${c.is_complete?'done':''}">
          <input type="checkbox" id="chk-${c.id}" ${c.is_complete?'checked':''} onchange="toggleChecklistItem('${c.id}',this.checked)">
          <label for="chk-${c.id}">${esc(c.label)}</label>
          <span class="checklist-uploads">
            ${(c.uploads||[]).map(u=>{const url=uploadUrls[u.file_path]||'';return `<span class="checklist-upload">${(u.content_type||'').startsWith('image/')?`<a href="${url}" target="_blank" rel="noopener"><img class="checklist-thumb" src="${url}" alt=""></a>`:`<a class="checklist-file" href="${url}" target="_blank" rel="noopener" title="${esc(u.file_name)}">📄</a>`}<button class="checklist-upload-del" title="Delete file" onclick="deleteChecklistUploadMobile('${u.id}','${u.file_path}')">✕</button></span>`}).join('')}
            <label class="checklist-upload-btn" title="Add photo or file">📷<input type="file" accept="image/*,application/pdf" style="display:none" onchange="onChecklistUploadMobile('${c.id}',this)"></label>
          </span>
        </div>`).join(''):'<p class="muted">No checklist for this job type.</p>'}
    </div>

    <div class="section-title">Notes</div>
    <div id="notes-thread">
      ${notes.length?notes.map(n=>`
        <div class="note ${n.author_type==='customer'?'customer':(n.is_office_only?'staff-office':'staff-visible')}">
          <div class="note-meta">${n.author_type==='customer'?'Customer':'Staff'}${n.is_office_only?' · office only':''} · ${fmtTime(n.created_at)}</div>
          ${esc(n.body)}
        </div>`).join(''):'<p class="muted">No notes yet.</p>'}
    </div>
    <textarea class="form-input" id="new-note-body" placeholder="Add a note…" style="min-height:60px;resize:vertical"></textarea>
    <label class="check-row"><input type="checkbox" id="new-note-office" checked style="width:18px;height:18px;accent-color:var(--accent)"> Office only (not visible to customer)</label>
    <button class="btn-primary" onclick="addNoteMobile('${j.id}')">Send</button>
  `;
}

async function setJobStatusMobile(jobId,status){
  if(status==='finished'&&!(await confirmFinishWithChecklistMobile(jobId)))return;
  try{
    const {error}=await sb.from('desk_jobs').update({status,updated_at:new Date().toISOString()}).eq('id',jobId);
    if(error)throw error;
    showToast('Status updated');
    await loadJobDetail(jobId);
  }catch(e){showToast('Could not update status')}
}
// Warn-and-confirm when finishing with unticked checklist items — real jobs
// sometimes legitimately skip items, so it's a confirm, not a block.
async function confirmFinishWithChecklistMobile(jobId){
  try{
    const {data,error}=await sb.from('desk_job_checklist_items').select('id,is_complete,is_header').eq('job_id',jobId);
    if(error)throw error;
    // Headers are section labels, not work — they can never be "incomplete".
    const open=(data||[]).filter(i=>!i.is_header&&!i.is_complete).length;
    if(!open)return true;
    return confirm(`${open} checklist item${open===1?'':'s'} still incomplete — finish the job anyway?`);
  }catch(e){return true}
}
async function clockIn(jobId){
  try{
    // Guard against double clock-in: one open entry per employee at a time,
    // otherwise overlapping sessions double-count hours in the reports.
    const {data:open,error:chkErr}=await sb.from('desk_job_time_entries')
      .select('id,job_id,job:desk_jobs(job_type,customer:desk_customers(name))')
      .eq('employee_id',myEmployee.id).is('clock_out',null).limit(1);
    if(chkErr)throw chkErr;
    if(open&&open.length){
      const other=open[0];
      if(String(other.job_id)===String(jobId)){
        showToast('Already clocked in on this job');
      }else{
        const label=other.job?`${other.job.job_type} — ${other.job.customer?.name||''}`:'another job';
        showToast(`Already clocked into ${label} — clock out first`);
      }
      return;
    }
    const {error}=await sb.from('desk_job_time_entries').insert({job_id:jobId,employee_id:myEmployee.id});
    if(error)throw error;
    showToast('Clocked in');
    await loadJobDetail(jobId);
  }catch(e){showToast('Could not clock in')}
}
async function clockOut(timeEntryId){
  try{
    const {error}=await sb.from('desk_job_time_entries').update({clock_out:new Date().toISOString()}).eq('id',timeEntryId);
    if(error)throw error;
    showToast('Clocked out');
    await loadJobDetail(currentJobId);
  }catch(e){showToast('Could not clock out')}
}
async function toggleChecklistItem(itemId,checked){
  try{
    const {error}=await sb.from('desk_job_checklist_items').update({
      is_complete:checked,
      completed_by:checked?(currentUser?.name||null):null,
      completed_at:checked?new Date().toISOString():null
    }).eq('id',itemId);
    if(error)throw error;
  }catch(e){showToast('Could not update checklist');await loadJobDetail(currentJobId)}
}
// Photo/PDF attached to one checklist item — the file picker offers the
// camera on phones, the file browser elsewhere.
async function onChecklistUploadMobile(itemId,input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')&&file.type!=='application/pdf'){showToast('Photos or PDFs only');input.value='';return}
  if(file.size>10*1024*1024){showToast('File must be under 10MB');input.value='';return}
  const safeName=(file.name.replace(/[^\w.\-]+/g,'_')||'upload').slice(-60);
  const path=currentJobId+'/'+itemId+'/'+Date.now()+'-'+safeName;
  try{
    showToast('Uploading…');
    const {error}=await sb.storage.from('desk-checklist-uploads').upload(path,file,{contentType:file.type});
    if(error)throw error;
    const {error:rowErr}=await sb.from('desk_checklist_item_uploads').insert({checklist_item_id:itemId,file_path:path,file_name:file.name,content_type:file.type,uploaded_by:currentUser?.name||null});
    if(rowErr)throw rowErr;
    showToast('Uploaded');
    await loadJobDetail(currentJobId);
  }catch(e){showToast('Could not upload')}
}
// Removes both the storage object and its tracking row.
async function deleteChecklistUploadMobile(uploadId,filePath){
  if(!confirm('Delete this file?'))return;
  try{
    const {error}=await sb.storage.from('desk-checklist-uploads').remove([filePath]);
    if(error)throw error;
    const {error:rowErr}=await sb.from('desk_checklist_item_uploads').delete().eq('id',uploadId);
    if(rowErr)throw rowErr;
    showToast('Deleted');
    await loadJobDetail(currentJobId);
  }catch(e){showToast('Could not delete')}
}
async function addNoteMobile(jobId){
  const bodyEl=document.getElementById('new-note-body');
  const body=bodyEl.value.trim();
  if(!body)return;
  const isOffice=document.getElementById('new-note-office').checked;
  try{
    const {error}=await sb.from('desk_job_notes').insert({job_id:jobId,body,is_office_only:isOffice});
    if(error)throw error;
    await loadJobDetail(jobId);
  }catch(e){showToast('Could not add note')}
}

(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){await enterSession(session.user)}else{renderSignIn()}
})();
</script>
